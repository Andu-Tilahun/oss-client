<div class="w-full">
  <div class="mb-4 flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-2 flex-shrink-0">
      <app-action-icon-button
        *ngIf="showAddButton"
        icon="plus"
        title="Add"
        (buttonClick)="addClick.emit()"
      ></app-action-icon-button>

      <app-action-icon-button
        *ngIf="showRefreshButton"
        icon="refresh"
        title="Refresh"
        (buttonClick)="refreshClick.emit()"
      ></app-action-icon-button>

      <app-action-icon-button
        *ngIf="showDownloadButton"
        icon="export"
        title="Download"
        (buttonClick)="downloadClick.emit()"
      ></app-action-icon-button>
    </div>

    <div class="min-w-0 flex-1">
      <ng-content select="[extraHeader]"></ng-content>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 dark:bg-gray-900 dark:border-gray-700">
    <div *ngIf="loading" class="relative min-h-[120px]">
      <div class="absolute inset-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm flex items-center justify-center z-10">
        <div class="flex items-center space-x-2">
          <svg class="animate-spin h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sm text-gray-600 dark:text-gray-400">Loading...</span>
        </div>
      </div>
    </div>

    <div *ngIf="data.length === 0 && !loading" class="px-6 py-16">
      <div class="flex flex-col items-center justify-center text-slate-500 dark:text-gray-400">
        <svg class="w-14 h-14 mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
        </svg>
        <p class="text-sm font-medium">{{ noDataMessage }}</p>
      </div>
    </div>

    <div *ngIf="data.length > 0" class="p-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <app-card-item-layout
        *ngFor="let item of data; trackBy: trackByIndex"
        [headerLeft]="getCardTitle(item)"
      >
        <span *ngIf="headerRightTemplate" cardHeaderRight class="inline-flex items-center ml-2">
          <ng-container
            [ngTemplateOutlet]="headerRightTemplate.templateRef"
            [ngTemplateOutletContext]="{ $implicit: item }"
          ></ng-container>
        </span>

        <span
          *ngIf="!headerRightTemplate && showCreatedDate"
          cardHeaderRight
          class="text-xs text-slate-500 whitespace-nowrap dark:text-gray-400"
        >
          {{ getCreatedDate(item) ? (getCreatedDate(item) | date:'mediumDate') : '-' }}
        </span>

        <div
          cardBody
          class="card-body"
          [class.cursor-pointer]="cardClickEnabled"
          (click)="cardClickEnabled && cardClick.emit(item)"
        >
          <ng-container *ngIf="bodyTemplate; else defaultBody">
            <ng-container
              [ngTemplateOutlet]="bodyTemplate.templateRef"
              [ngTemplateOutletContext]="{ $implicit: item }"
            ></ng-container>
          </ng-container>

          <ng-template #defaultBody>
            <div class="thumbnail-wrap" *ngIf="getThumbnailUrl(item); else noThumb">
              <img
                [src]="getThumbnailUrl(item)"
                [alt]="thumbnailAltAccessor(item)"
                class="thumbnail-image"
              />
            </div>
            <ng-template #noThumb>
              <div class="thumbnail-empty">No image available</div>
            </ng-template>
          </ng-template>
        </div>

        <div cardFooter>
          <ng-container *ngIf="footerTemplate; else defaultFooter">
            <ng-container
              [ngTemplateOutlet]="footerTemplate.templateRef"
              [ngTemplateOutletContext]="{ $implicit: item }"
            ></ng-container>
          </ng-container>

          <ng-template #defaultFooter>
            <div class="flex items-center gap-4 text-sm">
              <button
                *ngIf="showViewButton"
                type="button"
                class="action-link action-link--view"
                (click)="viewClick.emit(item)"
              >
                View
              </button>
              <button
                *ngIf="showEditButton"
                type="button"
                class="action-link action-link--edit"
                (click)="editClick.emit(item)"
              >
                Edit
              </button>
              <button
                *ngIf="showDeleteButton"
                type="button"
                class="action-link action-link--delete"
                (click)="deleteClick.emit(item)"
              >
                Delete
              </button>
            </div>
          </ng-template>
        </div>
      </app-card-item-layout>
    </div>

    <div *ngIf="showPagination && data.length > 0" class="bg-slate-50/60 dark:bg-gray-800/40 px-5 py-3 border-t border-slate-100 dark:border-gray-700">
      <app-pagination
        [total]="total"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        (pageChange)="onPaginationChange($event)"
      ></app-pagination>
    </div>
  </div>
</div>
