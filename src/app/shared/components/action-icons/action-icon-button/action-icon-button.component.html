<button
  type="button"
  class="inline-flex items-center justify-center w-8 h-8 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-all duration-200 shadow-sm hover:shadow"
  [ngClass]="[buttonSizeClass, buttonClass]"
  [disabled]="disabled"
  [attr.title]="computedTitle"
  (click)="click.emit()"
>
  <svg
    [ngClass]="[svgSizeClass, svgClass]"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      [attr.d]="iconPathD"
    ></path>
    <path
      *ngIf="icon === 'eye'"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
    ></path>
  </svg>
</button>
