<div class="border-b border-slate-100">
  <div class="flex items-end gap-2 w-full overflow-x-auto scrollbar-hide">

    <!-- Search Input -->
    <div *ngIf="showSearch" class="relative flex-shrink-0 w-56">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input
        type="search"
        required
        aria-required="true"
        [ngModel]="searchText"
        (ngModelChange)="onSearchTextChange($event)"
        (keyup.enter)="onSearch()"
        [placeholder]="searchPlaceholder"
        class="block w-full pl-9 pr-3 py-1.5 border border-slate-200 rounded-lg text-sm
               focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700"
      />
    </div>

    <!-- Apply Button -->
    <button
      *ngIf="showApplyButton && !useIconButtons"
      type="button"
      (click)="onSearch()"
      [disabled]="!hasValidSearchText"
      class="flex-shrink-0 px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm font-medium
             hover:bg-blue-600 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
    >
      {{ applyLabel }}
    </button>
    <button
      *ngIf="showApplyButton && useIconButtons"
      type="button"
      (click)="onSearch()"
      [disabled]="!hasValidSearchText"
      [attr.aria-label]="applyLabel"
      [title]="applyLabel"
      class="flex-shrink-0 h-[34px] w-[34px] rounded-lg bg-blue-500 text-white hover:bg-blue-600
             transition-colors disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z"></path>
      </svg>
    </button>

    <!-- Divider (desktop only: on mobile the next control is the filter toggle) -->
    <div *ngIf="showSearch || showApplyButton" class="hidden md:block flex-shrink-0 w-px h-5 bg-slate-200 self-center"></div>

    <!-- Mobile-only filter toggle -->
    <button
      *ngIf="collapsible"
      type="button"
      (click)="toggleCollapsed()"
      [attr.aria-expanded]="!isCollapsed"
      aria-label="Filters"
      title="Filters"
      class="md:hidden flex-shrink-0 h-[34px] w-[34px] rounded-lg border border-slate-200 bg-white text-slate-600
             hover:bg-slate-50 transition-colors flex items-center justify-center"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-width="2" d="M4 6h4m4 0h8M4 12h10m4 0h2M4 18h2m4 0h10"/>
        <circle cx="10" cy="6" r="2" stroke-width="2"/>
        <circle cx="16" cy="12" r="2" stroke-width="2"/>
        <circle cx="8" cy="18" r="2" stroke-width="2"/>
      </svg>
    </button>

    <!-- Mobile-only backdrop -->
    <button
      type="button"
      *ngIf="collapsible && !isCollapsed"
      class="fixed inset-0 z-[59] md:hidden border-0 p-0 m-0 cursor-default bg-slate-900/40 backdrop-blur-[10px]"
      (click)="toggleCollapsed()"
      aria-label="Close filters"
    ></button>

    <!-- Filters + Clear: mobile-first base = bottom sheet; md: restores the plain inline row -->
    <div
      class="flex flex-col items-stretch gap-3 fixed inset-x-0 bottom-0 z-[60] bg-white rounded-t-2xl shadow-2xl
             border-t border-slate-200 p-4 max-h-[75vh] overflow-y-auto transition-transform duration-300 ease-out
             md:static md:inset-auto md:z-auto md:flex-row md:items-end md:gap-2 md:bg-transparent md:rounded-none
             md:shadow-none md:border-t-0 md:p-0 md:max-h-none md:overflow-visible md:transition-none"
      [class.max-md:translate-y-full]="collapsible && isCollapsed"
    >
      <!-- Mobile-only sheet header -->
      <div class="flex md:hidden items-center justify-between">
        <span class="text-sm font-semibold text-slate-700">Filters</span>
        <button
          type="button"
          (click)="toggleCollapsed()"
          aria-label="Close filters"
          class="h-8 w-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Projected filter controls (dropdowns, ranges, etc.) -->
      <div class="flex flex-wrap md:flex-nowrap items-end gap-2 flex-1 min-w-0">
        <ng-content></ng-content>
      </div>

      <!-- Divider (desktop only) -->
      <div class="hidden md:block flex-shrink-0 w-px h-5 bg-slate-200 self-center"></div>

      <!-- Footer: Clear + mobile-only "Show results" -->
      <div class="flex items-center gap-2 pt-2 border-t border-slate-100 md:pt-0 md:border-t-0">
        <button
          type="button"
          (click)="onClear()"
          [attr.aria-label]="clearLabel"
          [title]="clearLabel"
          class="flex-shrink-0 h-[34px] w-[34px] rounded-lg bg-red-500 text-white hover:bg-red-600
                 transition-colors flex items-center justify-center"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <button
          type="button"
          (click)="toggleCollapsed()"
          class="md:hidden flex-1 px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition-colors"
        >
          Show results
        </button>
      </div>
    </div>

  </div>
</div>
