<app-modal
  [visible]="visible"
  [title]="title"
  size="md"
  [showFooter]="true"
  [showConfirmButton]="false"
  [showCancelButton]="false"
  (visibleChange)="onVisibleChange($event)"
>
  <div class="flex flex-col items-center text-center">
    <input
      #fileInput
      type="file"
      class="hidden"
      [accept]="accept"
      (change)="onFileSelected($event)"
    />

    <button
      type="button"
      class="w-full max-w-sm rounded-lg border-2 border-dashed border-gray-300 bg-gray-50 p-4 transition-colors hover:border-blue-400 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="isUploading"
      (click)="triggerFileInput(fileInput)"
    >
      <ng-container *ngIf="pendingPreviewUrl; else pickImage">
        <img
          [src]="pendingPreviewUrl"
          alt="Selected image preview"
          class="mx-auto max-h-56 w-full rounded-lg object-contain"
        />
        <p class="mt-2 text-xs text-gray-500">Click to choose a different image</p>
      </ng-container>

      <ng-template #pickImage>
        <div class="flex flex-col items-center py-8">
          <svg class="h-12 w-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <p class="mt-2 text-sm font-medium text-gray-700">Click to select an image</p>
          <p class="mt-1 text-xs text-gray-500">Max {{ maxSizeMB }}MB</p>
        </div>
      </ng-template>
    </button>

    <p *ngIf="errorMessage" class="mt-3 text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <ng-template #modalFooter>
    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="handleCancel()"
        [disabled]="isUploading"
        class="rounded-lg border border-red-200 bg-red-100 px-4 py-2 font-medium text-red-700 hover:bg-red-200 disabled:opacity-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="handleUpload()"
        [disabled]="!canUpload"
        class="rounded-lg bg-blue-500 px-4 py-2 font-medium text-white hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span *ngIf="isUploading" class="inline-flex items-center">
          <svg class="-ml-1 mr-2 h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Uploading...
        </span>
        <span *ngIf="!isUploading">Upload</span>
      </button>
    </div>
  </ng-template>
</app-modal>
