<app-modal
  [(visible)]="visible"
  [title]="title"
  size="md"
  [showFooter]="true"
  [showConfirmButton]="false"
  [showCancelButton]="false"
  (visibleChange)="visibleChange.emit($event)"
>
  <div class="flex flex-col items-center text-center">
    <app-profile-picture-upload
      #profilePictureUpload
      [currentFileId]="currentFileId"
      [deferUpload]="true"
      [showInlineUploadButton]="false"
      [uploadUrl]="resolvedUploadUrl"
      size="large"
      (fileUploaded)="onFileUploaded($event)"
      (uploadError)="onUploadError($event)"
    ></app-profile-picture-upload>
  </div>

  <ng-template #modalFooter>
    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="handleCancel()"
        [disabled]="isUploading"
        class="px-4 py-2 rounded-lg font-medium bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 disabled:opacity-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="handleUpload()"
        [disabled]="!canUpload"
        class="px-4 py-2 rounded-lg font-medium bg-blue-500 hover:bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="isUploading" class="inline-flex items-center">
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Uploading...
        </span>
        <span *ngIf="!isUploading">Upload</span>
      </button>
    </div>
  </ng-template>
</app-modal>
