<app-modal
  [(visible)]="visible"
  [title]="title"
  [size]="size"
  [showFooter]="true"
  [maskClosable]="maskClosable"
  (visibleChange)="visibleChange.emit($event)"
  (cancel)="handleClosed()"
>
  <ng-template #modalBody>
    <app-stepper [steps]="steps" [currentStep]="currentStep" (stepChange)="goToStep($event)"></app-stepper>

    <div class="mt-2">
      <ng-container *ngIf="stepBody">
        <ng-container *ngTemplateOutlet="stepBody"></ng-container>
      </ng-container>
    </div>
  </ng-template>

  <ng-template #modalFooter>
    <div class="flex items-center justify-between">
      <button
        type="button"
        (click)="modalComponent.close()"
        class="px-4 py-2 rounded-lg font-medium transition-colors bg-red-100 hover:bg-red-200 text-red-700 border border-red-200"
      >
        {{ cancelText }}
      </button>

      <div class="flex items-center gap-3">
        <button
          *ngIf="currentStep > 1"
          type="button"
          (click)="previousStep()"
          class="px-4 py-2 rounded-lg font-medium transition-colors bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200"
        >
          {{ backLabel }}
        </button>

        <button
          *ngIf="currentStep < steps.length"
          type="button"
          (click)="next.emit()"
          class="px-4 py-2 rounded-lg font-medium transition-colors bg-blue-500 hover:bg-blue-600 text-white"
        >
          {{ nextLabel }}
        </button>

        <button
          *ngIf="currentStep === steps.length"
          type="button"
          [disabled]="isSubmitting"
          (click)="submitForm.emit()"
          class="px-4 py-2 rounded-lg font-medium transition-colors bg-blue-500 hover:bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="isSubmitting" class="inline-flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Submitting...
          </span>
          <span *ngIf="!isSubmitting">{{ submitLabel }}</span>
        </button>
      </div>
    </div>
  </ng-template>
</app-modal>
