<app-modal
  [(visible)]="visible"
  title="File Preview"
  size="xl"
  [maskClosable]="true"
  [showConfirmButton]="false"
  [cancelText]="'Close'"
  (visibleChange)="visibleChange.emit($event)"
  (cancel)="onClose()"
>
  <ng-template #modalBody>
    <div class="w-full" style="height: 70vh;">
      <iframe
        *ngIf="safeUrl"
        [src]="safeUrl"
        class="w-full h-full rounded border border-gray-200"
        frameborder="0"
        allowfullscreen
      ></iframe>
      <div *ngIf="!safeUrl" class="flex items-center justify-center h-full text-gray-400 text-sm">
        No file to preview.
      </div>
    </div>
  </ng-template>
</app-modal>
