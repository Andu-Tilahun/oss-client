<section id="contact" class="contact-section">
  <div class="container">
    <div class="section-title-wrap">
      <h2>Contact Us</h2>
      <p>Reach out for partnerships, investment details, and support.</p>
    </div>

    <div class="contact-layout">
      <aside class="contact-sidebar">
        <h3 class="contact-sidebar-title">Connect With Us</h3>
        <p class="contact-sidebar-desc">Follow us or get in touch directly.</p>

        <ul class="contact-social-list">
          <li *ngFor="let link of socialLinks">
            <a class="contact-social-link" [href]="link.url" target="_blank" rel="noopener noreferrer">
              <span class="contact-social-icon" [style.background]="brandColor(link.platform)" aria-hidden="true">
                <app-social-icon [platform]="link.platform" class="contact-social-icon-svg"></app-social-icon>
              </span>
              <span>{{ link.platform | titlecase }}</span>
            </a>
          </li>
          <li>
            <a class="contact-social-link" [href]="emailHref">
              <span class="contact-social-icon contact-social-icon--email" aria-hidden="true">&#64;</span>
              <span>{{ displayEmail }}</span>
            </a>
          </li>
          <li>
            <a class="contact-social-link" [href]="phoneHref">
              <span class="contact-social-icon contact-social-icon--phone" aria-hidden="true">☎</span>
              <span>{{ displayPhone }}</span>
            </a>
          </li>
        </ul>
      </aside>

      <div class="contact-form-card">
        <h3 class="contact-form-title">Send Message</h3>

        <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="contact-form-row contact-form-row--two">
            <div class="contact-field">
              <label for="contact-name">Name <span class="required">*</span></label>
              <input
                id="contact-name"
                type="text"
                formControlName="name"
                placeholder="Enter your name"
                [class.contact-input--error]="isInvalid('name')"
              />
            </div>
            <div class="contact-field">
              <label for="contact-email">Email <span class="required">*</span></label>
              <input
                id="contact-email"
                type="email"
                formControlName="email"
                placeholder="Enter your email"
                [class.contact-input--error]="isInvalid('email')"
              />
            </div>
          </div>

          <div class="contact-form-row">
            <div class="contact-field contact-field--half">
              <label for="contact-phone">Phone</label>
              <input
                id="contact-phone"
                type="tel"
                formControlName="phone"
                placeholder="Enter your phone number"
              />
            </div>
          </div>

          <div class="contact-form-row">
            <div class="contact-field">
              <label for="contact-message">Message <span class="required">*</span></label>
              <textarea
                id="contact-message"
                formControlName="message"
                rows="5"
                placeholder="Enter your message"
                [class.contact-input--error]="isInvalid('message')"
              ></textarea>
            </div>
          </div>

          <div class="contact-captcha">
            <div class="contact-captcha-row">
              <p class="contact-captcha-label">Verify: <strong>{{ captchaQuestion }} = ?</strong></p>
              <button type="button" class="contact-captcha-refresh" (click)="refreshCaptcha()" aria-label="New question">↻ New</button>
            </div>
            <input
              type="number"
              formControlName="captchaInput"
              placeholder="Type the number"
              class="contact-captcha-input"
              [class.contact-input--error]="isInvalid('captchaInput') || submitError"
              autocomplete="off"
            />
          </div>

          <p *ngIf="submitMessage" class="contact-feedback" [class.contact-feedback--error]="submitError">
            {{ submitMessage }}
          </p>

          <button type="submit" class="contact-submit-btn" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Sending…' : 'Send Message' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
