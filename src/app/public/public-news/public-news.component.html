<section id="news" class="news-section">
  <div class="container">
    <div class="section-title-wrap">
      <h2>News</h2>
    </div>

    <div *ngIf="loading" class="news-loading">Loading news...</div>
    <div *ngIf="!loading && error" class="news-empty">Unable to load news at this time.</div>
    <div *ngIf="!loading && !error && allNewsItems.length === 0" class="news-empty">No news articles published yet.</div>

    <div *ngIf="!loading && !error && allNewsItems.length > 0 && activeItem" class="news-layout">
      <article class="news-feature">
        <div class="news-feature-image-wrap">
          <img *ngIf="activeItem.mediaKind !== 'VIDEO'" class="news-feature-image" [src]="activeItem.mediaUrl" [alt]="activeItem.title" loading="lazy" />
          <video *ngIf="activeItem.mediaKind === 'VIDEO'" class="news-feature-image" [src]="activeItem.mediaUrl" controls></video>
          <span class="news-feature-badge">{{ activeItem.category }}</span>
        </div>

        <div class="news-feature-content">
          <h3 class="news-feature-title">{{ activeItem.title }}</h3>
          <p class="news-feature-date">{{ activeItem.date }}</p>

          <p class="news-feature-summary">{{ activeItem.summary }}</p>

          <p class="news-feature-body" [class.news-feature-body--expanded]="bodyExpanded">
            {{ activeItem.body }}
          </p>

          <button type="button" class="news-view-more" (click)="toggleBodyExpanded()">
            {{ bodyExpanded ? 'View Less' : 'View More' }}
            <span class="news-chevron" [class.news-chevron--up]="bodyExpanded">&#9662;</span>
          </button>
        </div>
      </article>

      <aside class="news-sidebar">
        <h4 class="news-sidebar-heading">Latest News</h4>

        <ul class="news-sidebar-list">
          <li *ngFor="let item of sidebarItems">
            <button
              type="button"
              class="news-sidebar-item"
              [class.news-sidebar-item--active]="item.id === activeItem.id"
              (click)="selectItem(item)"
            >
              <img *ngIf="item.mediaKind !== 'VIDEO'" class="news-sidebar-thumb" [src]="item.mediaUrl" [alt]="item.title" loading="lazy" />
              <video *ngIf="item.mediaKind === 'VIDEO'" class="news-sidebar-thumb" [src]="item.mediaUrl" muted></video>

              <div class="news-sidebar-text">
                <h5>{{ item.title }}</h5>
                <p class="news-sidebar-excerpt">{{ item.excerpt }}</p>
                <div class="news-sidebar-meta-row">
                  <span class="news-sidebar-year">{{ item.year }}</span>
                  <span class="news-sidebar-tag">{{ item.category }}</span>
                </div>
              </div>
            </button>
          </li>
        </ul>

        <button *ngIf="totalSidebarPages > 1" type="button" class="news-next-btn" (click)="showNextNews()">
          Next
          <span class="news-chevron">&#9662;</span>
        </button>
      </aside>
    </div>
  </div>
</section>
