<!-- Mobile: dimmed backdrop (same idea as public-header overlay) -->
<button
  type="button"
  *ngIf="mobileOpen"
  class="sidebar-backdrop fixed inset-0 z-[44] md:hidden border-0 p-0 m-0 cursor-default bg-slate-900/40 backdrop-blur-[10px]"
  (click)="closeMobileDrawer()"
  aria-label="Close navigation menu"
></button>

<div
  id="app-sidebar-nav"
  [class]="isCollapsed ? 'w-20' : 'w-64'"
  class="sidebar-panel font-sans bg-gray-900 text-white h-full transition-all duration-300 flex flex-col max-md:fixed max-md:top-0 max-md:left-0 max-md:z-[50] max-md:h-full max-md:shadow-2xl max-md:!w-64 max-md:transition-transform max-md:duration-300 md:relative md:translate-x-0"
  [class.max-md:-translate-x-full]="!mobileOpen"
  [class.max-md:translate-x-0]="mobileOpen"
>
  <!-- Top user identity -->
  <div class="p-4 border-b border-gray-800 space-y-3">
    <div class="flex items-center justify-between" *ngIf="currentUser$ | async as topUser">
      <div class="flex items-center space-x-3 min-w-0">
        <img
          [src]="userAvatar(topUser)"
          [alt]="userName(topUser)"
          class="w-10 h-10 rounded-full border-2 border-indigo-400 shrink-0"
        />
        <div *ngIf="!isCollapsed" class="min-w-0">
          <p class="text-sm font-semibold text-white truncate">{{ userName(topUser) }}</p>
          <p class="text-xs text-gray-400 truncate">{{ userEmail(topUser) }}</p>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div *ngIf="!isCollapsed" class="relative">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="applySearch()"
        placeholder="Search menu..."
        class="w-full px-3 py-2 text-sm bg-gray-800 border border-gray-700 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      />
    </div>
  </div>

  <!-- Menu Items -->
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="space-y-1 px-3">
      <li *ngFor="let item of menuItems">
        <!-- Main Menu Item -->
        <div>
          <a
            [routerLink]="getItemRoute(item)"
            [fragment]="getItemFragment(item)"
            routerLinkActive="bg-blue-600"
            [routerLinkActiveOptions]="{exact: false}"
            (click)="item.children && toggleSubmenu(item)"
            class="flex items-center justify-between px-3 py-3 rounded-lg hover:bg-gray-800 cursor-pointer transition-colors group"
          >
            <div class="flex items-center space-x-3">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
              </svg>
              <span *ngIf="!isCollapsed" class="text-sm font-medium">{{ item.label }}</span>
            </div>

            <!-- Dropdown Arrow -->
            <svg
              *ngIf="item.children && !isCollapsed"
              [class.rotate-180]="item.expanded"
              class="w-4 h-4 transition-transform"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </a>

          <!-- Submenu -->
          <ul
            *ngIf="item.children && item.expanded && !isCollapsed"
            class="ml-8 mt-2 space-y-1"
          >
            <li *ngFor="let child of item.children">
              <a
                [routerLink]="child.route"
                routerLinkActive
                #rla="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: true }"
                class="block px-3 py-2 text-sm rounded-lg hover:bg-gray-800 transition-colors"
                [ngClass]="{
                  'text-blue-400 bg-gray-800': rla.isActive,
                  'text-gray-400 hover:text-white': !rla.isActive
                }"
              >
                {{ child.label }}
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>

  <ng-container *ngIf="currentUser$ | async as accountUser">
    <!-- Bottom account actions -->
    <div class="shrink-0 border-t border-gray-800 p-3 space-y-2">
      <button
        type="button"
        (click)="openEditProfile()"
        class="w-full flex items-center rounded-lg hover:bg-gray-800 transition-colors text-left"
        [ngClass]="isCollapsed ? 'justify-center p-2' : 'space-x-3 px-3 py-2'"
      >
        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
        <span *ngIf="!isCollapsed" class="text-sm text-gray-200">Edit Profile</span>
      </button>

      <button
        type="button"
        (click)="logout()"
        class="w-full flex items-center rounded-lg hover:bg-red-950/40 transition-colors text-left"
        [ngClass]="isCollapsed ? 'justify-center p-2' : 'space-x-3 px-3 py-2'"
      >
        <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span *ngIf="!isCollapsed" class="text-sm text-red-400 font-medium">Logout</span>
      </button>

      <!-- Footer: collapse control is desktop-only; mobile uses header hamburger + backdrop -->
      <div class="hidden md:block pt-2">
        <button
          (click)="toggleSidebar()"
          class="w-full flex items-center justify-center px-3 py-2 rounded-lg hover:bg-gray-800 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              *ngIf="!isCollapsed"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
            ></path>
            <path
              *ngIf="isCollapsed"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 5l7 7-7 7M5 5l7 7-7 7"
            ></path>
          </svg>
          <span *ngIf="!isCollapsed" class="ml-2 text-sm">Collapse</span>
        </button>
      </div>
    </div>

  </ng-container>
</div>
