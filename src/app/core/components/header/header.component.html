<header class="bg-white shadow-sm border-b border-gray-200 relative z-30">
  <div class="flex items-center justify-between px-4 sm:px-6 py-4 gap-4">

    <!-- Left: platform logo + name -->
    <a routerLink="/home" class="flex items-center gap-3 min-w-0 shrink-0 text-inherit no-underline hover:opacity-90 transition-opacity">
      <img *ngIf="orgLogoUrl" [src]="orgLogoUrl" alt="Logo"
        class="w-10 h-10 rounded-lg object-cover shadow-sm" />
      <div *ngIf="!orgLogoUrl"
        class="w-10 h-10 bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-lg flex items-center justify-center shadow-sm">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <span class="text-xl font-bold text-emerald-800 tracking-tight">{{ orgName }}</span>
    </a>

    <!-- Right: Notifications, mobile nav -->
    <div class="flex items-center space-x-2 sm:space-x-4 flex-1 justify-end min-w-0">

      <!-- Notifications dropdown -->
      <div class="relative shrink-0">
        <button
          type="button"
          (click)="toggleNotificationPanel($event)"
          class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
          [attr.aria-expanded]="showNotificationPanel"
          aria-haspopup="true"
          aria-label="Notifications"
        >
          <svg
            class="w-6 h-6"
            [class.notification-bell--unread]="badgeTotal > 0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span
            *ngIf="badgeTotal > 0"
            class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 flex items-center justify-center
                   rounded-full bg-red-500 text-white text-[10px] font-bold leading-none
                   ring-2 ring-white animate-pulse"
            [attr.aria-label]="badgeTotal + ' unread notifications'"
          >{{ badgeTotal > 9 ? '9+' : badgeTotal }}</span>
        </button>

        <div
          *ngIf="showNotificationPanel"
          class="absolute right-0 mt-2 w-[min(100vw-2rem,22rem)] max-h-[min(70vh,24rem)] flex flex-col rounded-xl border border-gray-200 bg-white shadow-lg z-50 overflow-hidden"
          role="menu"
        >
          <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between shrink-0">
            <span class="text-sm font-semibold text-gray-900">Notifications</span>
            <div class="flex items-center gap-3">
              <button
                *ngIf="badgeTotal > 0"
                type="button"
                (click)="markAllAsRead()"
                class="text-xs font-medium text-indigo-600 hover:text-indigo-800"
              >
                Mark all read
              </button>
              <span *ngIf="!previewLoading && previewTotal > 0" class="text-xs text-gray-500">{{ previewTotal }} total</span>
            </div>
          </div>

          <div class="overflow-y-auto flex-1 min-h-0">
            <div *ngIf="previewLoading" class="px-4 py-8 text-center text-sm text-gray-500">Loading…</div>
            <div *ngIf="!previewLoading && previewError" class="px-4 py-6 text-center text-sm text-red-600">
              {{ previewError }}
            </div>
            <div *ngIf="!previewLoading && !previewError && previewItems.length === 0" class="px-4 py-8 text-center text-sm text-gray-500">
              No notifications yet.
            </div>
            <ul *ngIf="!previewLoading && !previewError && previewItems.length > 0" class="divide-y divide-gray-100">
              <li
                *ngFor="let n of previewItems"
                (click)="onNotificationClick(n)"
                class="flex items-start gap-2 px-4 py-3 cursor-pointer transition-colors"
                [class.bg-blue-50]="!n.isRead"
              >
                <span
                  *ngIf="!n.isRead"
                  class="mt-1.5 shrink-0 w-2 h-2 rounded-full bg-blue-500"
                ></span>
                <span *ngIf="n.isRead" class="mt-1.5 shrink-0 w-2 h-2"></span>
                <div class="min-w-0">
                  <p class="text-sm font-medium text-gray-900 line-clamp-1" [class.font-semibold]="!n.isRead">{{ n.subject || n.notificationType }}</p>
                  <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                    <span *ngIf="n.eventType" class="text-xs text-gray-500">{{ formatEventType(n.eventType) }}</span>
                    <span *ngIf="n.notificationType === 'EMAIL'" class="text-[10px] font-medium text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">Email</span>
                  </div>
                  <p class="text-xs text-gray-400 mt-1">{{ formatPreviewWhen(n) }}</p>
                </div>
              </li>
            </ul>
          </div>

          <div class="border-t border-gray-100 p-2 shrink-0 bg-gray-50/80">
            <button
              type="button"
              (click)="goToAllNotifications()"
              class="w-full py-2.5 text-sm font-medium text-indigo-600 hover:text-indigo-800 hover:bg-white rounded-lg transition-colors"
            >
              More
            </button>
          </div>
        </div>
      </div>

      <!-- Profile: clicking navigates to edit profile -->
      <button
        type="button"
        *ngIf="currentUser"
        (click)="editProfile()"
        class="flex items-center justify-center w-9 h-9 rounded-full overflow-hidden shrink-0 ring-2 ring-transparent hover:ring-emerald-400 transition-all focus:outline-none"
        aria-label="Edit profile"
      >
        <img [src]="userAvatar()" alt="Profile" class="w-full h-full object-cover" />
      </button>

      <!-- Logout: always visible -->
      <button
        type="button"
        *ngIf="currentUser"
        (click)="logout()"
        class="flex items-center gap-1.5 shrink-0 px-3 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors"
        aria-label="Logout"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>

      <!-- Mobile menu -->
      <button
        type="button"
        class="md:hidden flex flex-col justify-center gap-1.5 w-10 h-10 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors shrink-0"
        (click)="toggleMobileNav()"
        [attr.aria-label]="mobileNavOpen ? 'Close navigation menu' : 'Open navigation menu'"
        aria-controls="app-sidebar-nav"
        [attr.aria-expanded]="mobileNavOpen"
      >
        <span class="w-5 h-0.5 bg-gray-800 rounded-sm"></span>
        <span class="w-5 h-0.5 bg-gray-800 rounded-sm"></span>
        <span class="w-5 h-0.5 bg-gray-800 rounded-sm"></span>
      </button>
    </div>
  </div>
</header>
