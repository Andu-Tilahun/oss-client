<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-xl font-bold text-gray-900">Farm Plot Detail</h1>
    <a
      routerLink="/farm-leases"
      class="text-sm font-medium text-indigo-600 hover:text-indigo-800"
    >
      Back
    </a>
  </div>

  <app-farm-plot-view
    [id]="plotId"
    [showCreateLeaseButton]="showCreateLeaseCta"
    (createLease)="openCreateLeaseFromPlot()"
  ></app-farm-plot-view>
</div>

<app-farm-lease-create-modal
  *ngIf="isInvestor"
  [(visible)]="showCreateModal"
  [selectedFarmPlot]="farmPlot"
  (leaseCreated)="onLeaseCreated()"
></app-farm-lease-create-modal>
