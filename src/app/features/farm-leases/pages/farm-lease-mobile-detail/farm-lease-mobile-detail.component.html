<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-xl font-bold text-gray-900">Lease Detail</h1>
    <a routerLink="/farm-leases" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">Back</a>
  </div>

  <div *ngIf="loading" class="text-sm text-gray-600">Loading lease detail...</div>
  <div *ngIf="error && !loading" class="text-sm text-red-600">{{ error }}</div>
  <app-farm-lease-view *ngIf="lease && !loading" [lease]="lease"></app-farm-lease-view>
</div>
