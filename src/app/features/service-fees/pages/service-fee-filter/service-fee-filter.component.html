<app-filter-bar
  [searchText]="searchText"
  (searchTextChange)="onSearchTextChange($event)"
  searchPlaceholder="Search fee..."
  (searchChange)="onSearch()"
  (clearFilters)="onClearFilters()"
>
  <select
    class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    [ngModel]="paymentType"
    (ngModelChange)="onPaymentTypeChange($event)"
  >
    <option value="">All payment types</option>
    <option *ngFor="let opt of paymentTypeOptions" [value]="opt.value">
      {{ opt.label }}
    </option>
  </select>

  <select
    class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    [ngModel]="active"
    (ngModelChange)="onActiveChange($event)"
  >
    <option value="true">Active</option>
    <option value="false">Inactive</option>
    <option value="">All</option>
  </select>
</app-filter-bar>
