<app-page-split-layout
  [showLeftTitle]="true"
  [showRightTitle]="true"
  leftTitle="Investment Package"
  rightTitle="Investment Package Detail"
  [rightItem]="selectedInvestmentPackage"
  [rightEmptyMessage]="'Select a row to view details.'"
  [showRightEditButton]="false"
  [rightActions]="rightActions"
>
  <ng-template #leftContent>
    <app-data-table
      [columns]="columns"
      [data]="investmentPackages"
      [loading]="loading"
      [total]="total"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [showAddButton]="isAdmin"
      [showRefreshButton]="true"
      [showViewButton]="false"
      [showEditButton]="false"
      [showDeleteButton]="false"
      [showActionColumn]="isAdmin"
      [rowActions]="tableRowActions"
      [rowClickable]="true"
      [addButtonText]="'Create Investment Package'"
      (pageChange)="onPageChange($event)"
      (addClick)="onAdd()"
      (refreshClick)="onRefresh()"
      (rowClick)="onView($event)"
    >

      <div extraTableHeader class="w-full min-w-0">
        <app-investment-package-filter
          [(searchText)]="searchText"
          [(status)]="status"
          (filterChange)="onFilterChange()"
          (searchChange)="onFilterChange()"
          (clearFilters)="clearFilters()"
        ></app-investment-package-filter>
      </div>

    </app-data-table>
  </ng-template>

  <ng-template #rightContent let-investmentPackage>
    <app-investment-package-detail-panel
      [investmentPackage]="investmentPackage"
      [refreshKey]="detailRefreshKey"
      [tabs]="tabs"
      (extensionWorkerAssigned)="onExtensionWorkerAssigned($event)"
    ></app-investment-package-detail-panel>
  </ng-template>
</app-page-split-layout>

<app-investment-package-create-modal
  [(visible)]="showCreateInvestmentPackageModal"
  (investmentPackageCreated)="onInvestmentPackageCreated()"
></app-investment-package-create-modal>

<app-investment-package-edit-modal
  [(visible)]="showEditInvestmentPackageModal"
  [investmentPackage]="selectedInvestmentPackage"
  (investmentPackageUpdated)="onInvestmentPackageUpdated()"
></app-investment-package-edit-modal>

<app-investment-package-create-investment-modal
  [(visible)]="showCreateInvestmentModal"
  [investmentPackage]="selectedInvestmentPackage"
  (investmentCreated)="onInvestmentCreated()"
></app-investment-package-create-investment-modal>
