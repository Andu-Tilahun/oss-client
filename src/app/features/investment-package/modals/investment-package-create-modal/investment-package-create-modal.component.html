<app-multi-step-form-modal
  [(visible)]="visible"
  title="Create Investment Package"
  [steps]="steps"
  [(currentStep)]="currentStep"
  size="xxl"
  [isSubmitting]="isLoading"
  submitLabel="Create Investment Package"
  (next)="onNext()"
  (submitForm)="onSubmit()"
  (cancelled)="onCancelled()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #stepBody>
    <app-investment-package-create-wizard #wizard [currentStep]="currentStep"></app-investment-package-create-wizard>
  </ng-template>
</app-multi-step-form-modal>
