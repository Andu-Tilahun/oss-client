<div [ngClass]="showLabel ? 'flex items-center gap-2 flex-shrink-0 min-w-0' : 'min-w-[160px]'">
  <label
    *ngIf="showLabel"
    class="text-sm font-medium text-slate-600 whitespace-nowrap shrink-0"
    [attr.for]="selectId"
  >
    {{ label }}
  </label>
  <select
    [id]="selectId"
    [ngModel]="status"
    (ngModelChange)="onStatusChange($event)"
    [ngClass]="showLabel
      ? 'min-w-[7rem] w-40 max-w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700 bg-white'
      : 'w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700 bg-white'"
  >
    <option [ngValue]="''">{{ allOptionLabel }}</option>
    <option *ngFor="let s of statuses" [ngValue]="s">{{ s }}</option>
  </select>
</div>
