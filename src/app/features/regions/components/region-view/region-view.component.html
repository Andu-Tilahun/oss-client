<div *ngIf="!region" class="p-6 text-sm text-gray-400 text-center">Select a region to view details.</div>

<div *ngIf="region">
  <app-detail-card>
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-8">
      <h3 class="text-2xl font-bold text-gray-900">{{ region.name }}</h3>
    </div>
    <hr class="border-gray-200 mb-8" />

    <app-detail-section title="Region Information">
      <app-detail-field label="Name" [value]="region.name"></app-detail-field>
    </app-detail-section>
  </app-detail-card>
</div>
