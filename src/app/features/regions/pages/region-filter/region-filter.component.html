<div class="filter-dropdown-container flex flex-col gap-3">
  <div class="filter-content flex items-center gap-4 flex-wrap">
    <!-- Search Input -->
    <div class="flex-1 min-w-[250px]">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <input
          type="search"
          [ngModel]="searchText"
          (ngModelChange)="onSearchTextChange($event)"
          (keyup.enter)="onSearch()"
          placeholder="Search regions..."
          class="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700"
        />
      </div>
    </div>

    <!-- Search Button -->
    <button
      (click)="onSearch()"
      class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors text-sm font-medium"
    >
      Search
    </button>

    <!-- Clear Filters Button -->
    <button
      type="button"
      (click)="onClearFilters()"
      aria-label="Clear Filters"
      title="Clear Filters"
      class="flex-shrink-0 h-[34px] w-[34px] rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors flex items-center justify-center"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
