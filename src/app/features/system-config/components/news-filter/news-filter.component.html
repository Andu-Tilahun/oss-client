<app-filter-bar
  [(searchText)]="searchText"
  (searchTextChange)="onSearchTextInput($event)"
  searchPlaceholder="Search by title..."
  applyLabel="Search"
  clearLabel="Clear"
  (searchChange)="onSearch()"
  (clearFilters)="onClearFilters()"
>
  <select
    [ngModel]="selectedStatus"
    (ngModelChange)="onStatusChange($event)"
    class="px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 w-40"
  >
    <option value="">Status: All</option>
    <option *ngFor="let s of statuses" [value]="s">Status: {{ s }}</option>
  </select>
</app-filter-bar>
