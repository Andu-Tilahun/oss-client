<app-detail-card *ngIf="payment">
  <div class="flex items-start justify-between gap-4 mb-8">
    <div>
      <h3 class="text-xl font-bold text-gray-900 font-mono">{{ payment.orderNumber }}</h3>
      <p class="text-sm text-gray-500 mt-1">{{ payment.utility }}</p>
    </div>
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border"
          [ngClass]="statusPillClass(payment.paymentDetailStatus)">
      {{ payment.paymentDetailStatus }}
    </span>
  </div>
  <hr class="mb-8"/>
  <app-detail-section title="Customer">
    <app-detail-field label="Name" [value]="payment.fullName" />
    <app-detail-field label="Email" [value]="payment.email" />
    <app-detail-field label="Phone" [value]="payment.phoneNumber" />
  </app-detail-section>
  <app-detail-section title="Payment">
    <app-detail-field label="Amount" [value]="formatAmount(payment.amount)" />
    <app-detail-field label="Utility" [value]="payment.utility" />
    <app-detail-field label="Transaction ID" [value]="payment.transactionId || '—'" />
    <app-detail-field label="Status" [value]="payment.paymentDetailStatus" />
  </app-detail-section>
  <app-detail-section title="Dates">
    <app-detail-field label="Created" [value]="formatDate(payment.createdAt)" />
    <app-detail-field label="Due Date" [value]="formatDate(payment.dueDate)" />
    <app-detail-field label="Paid Date" [value]="formatDate(payment.paidDate)" />
    <app-detail-field label="Expires" [value]="formatDate(payment.expirationDate)" />
  </app-detail-section>
</app-detail-card>
