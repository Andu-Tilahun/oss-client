<app-page-split-layout
  [showLeftTitle]="true"
  leftTitle="Bank Accounts"
  [showRightTitle]="true"
  rightTitle="Account Detail"
  [rightItem]="selectedAccount"
  [rightEmptyMessage]="'Select an account to view details.'"
  [showRightEditButton]="true"
  (rightEdit)="openEdit($event)"
>
  <ng-template #leftContent>
    <div class="p-4">
      <app-data-table
        [columns]="columns"
        [data]="displayedAccounts"
        [selectedRowId]="selectedAccount?.id ?? null"
        [loading]="loading"
        [total]="total"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [rowClickable]="true"
        [rowDetailTemplate]="rightContent"
        [showAddButton]="true"
        [showEditButton]="false"
        [showDeleteButton]="false"
        [rowActions]="rowActions"
        [noDataMessage]="'No bank accounts yet.'"
        (pageChange)="onPageChange($event)"
        (addClick)="openCreate()"
        (rowClick)="onView($event)"
      >
        <div extraTableHeader class="w-full flex justify-end">
          <app-bank-account-filter
            [(searchText)]="searchText"
            (searchChange)="onSearch()"
            (clearFilters)="clearFilters()"
          ></app-bank-account-filter>
        </div>
      </app-data-table>
    </div>
  </ng-template>

  <ng-template #rightContent let-account>
    <app-bank-account-view [account]="account"></app-bank-account-view>
  </ng-template>
</app-page-split-layout>

<!-- Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800">{{ editingId ? 'Edit Bank Account' : 'Add Bank Account' }}</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSave()" class="space-y-3">
      <div class="grid grid-cols-1 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bank Name *</label>
          <input formControlName="bankName" type="text"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="e.g. Commercial Bank of Ethiopia" />
          <p *ngIf="form.get('bankName')?.invalid && form.get('bankName')?.touched" class="text-red-500 text-xs mt-1">Required</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Account Number *</label>
          <input formControlName="accountNumber" type="text"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="e.g. 1000123456789" />
          <p *ngIf="form.get('accountNumber')?.invalid && form.get('accountNumber')?.touched" class="text-red-500 text-xs mt-1">Required</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Account Holder Name *</label>
          <input formControlName="accountHolderName" type="text"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="e.g. ABC Farm Investment PLC" />
          <p *ngIf="form.get('accountHolderName')?.invalid && form.get('accountHolderName')?.touched" class="text-red-500 text-xs mt-1">Required</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Branch Name</label>
            <input formControlName="branchName" type="text"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Optional" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">SWIFT / BIC Code</label>
            <input formControlName="swiftCode" type="text"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Optional" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea formControlName="description" rows="2"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Optional notes for investors"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Display Order</label>
            <input formControlName="displayOrder" type="number"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div class="flex items-end pb-2">
            <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
              <input formControlName="active" type="checkbox" class="rounded" />
              Active
            </label>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()" class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
