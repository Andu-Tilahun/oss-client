<app-page-split-layout
  [showLeftTitle]="true"
  leftTitle="Regions / Locations"
  [showRightTitle]="true"
  rightTitle="Region Detail"
  [rightItem]="selectedRegion"
  [rightEmptyMessage]="'Select a region to view details.'"
  [showRightEditButton]="true"
  (rightEdit)="openEdit($event)"
>
  <ng-template #leftContent>
    <div class="p-4">
      <app-data-table
        [columns]="columns"
        [data]="regions"
        [loading]="loading"
        [total]="total"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [showPagination]="true"
        [showIndex]="true"
        [rowClickable]="true"
        [showAddButton]="true"
        [showEditButton]="false"
        [showDeleteButton]="false"
        [rowActions]="rowActions"
        [noDataMessage]="'No regions yet.'"
        (pageChange)="onPageChange($event)"
        (addClick)="openCreate()"
        (rowClick)="onView($event)"
      >
        <div extraTableHeader class="w-full min-w-0">
          <app-filter-bar
            [(searchText)]="searchText"
            searchPlaceholder="Search by name..."
            applyLabel="Search"
            clearLabel="Clear"
            (searchChange)="onSearch()"
            (clearFilters)="clearFilters()"
          ></app-filter-bar>
        </div>
      </app-data-table>
    </div>
  </ng-template>

  <ng-template #rightContent let-region>
    <app-region-view [region]="region"></app-region-view>
  </ng-template>
</app-page-split-layout>

<!-- Create / Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
      <h2 class="text-base font-semibold text-gray-800">{{ editingId ? 'Edit Region' : 'New Region' }}</h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSave()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Region Name <span class="text-red-500">*</span></label>
        <input formControlName="name" type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          placeholder="e.g. Oromia" />
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
          class="mt-1 text-xs text-red-600">Name is required</p>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()"
          class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving"
          class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-60">
          {{ saving ? 'Saving...' : (editingId ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
