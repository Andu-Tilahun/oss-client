<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-gray-800">Regions / Locations</h2>
    <button (click)="openCreate()" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors">
      + Add Region
    </button>
  </div>

  <div *ngIf="loading" class="text-sm text-gray-500">Loading...</div>

  <div *ngIf="!loading">
    <p *ngIf="regions.length === 0" class="text-sm text-gray-500">No regions yet. Add one above.</p>

    <table *ngIf="regions.length > 0" class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
      <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
        <tr>
          <th class="px-4 py-3 text-left">#</th>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let region of regions; let i = index" class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 text-gray-400">{{ i + 1 }}</td>
          <td class="px-4 py-3 font-medium text-gray-800">{{ region.name }}</td>
          <td class="px-4 py-3 text-right space-x-2">
            <button (click)="openEdit(region)"
                    class="text-xs px-3 py-1.5 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
              Edit
            </button>
            <button (click)="onDelete(region.id)"
                    [disabled]="deleting === region.id"
                    class="text-xs px-3 py-1.5 rounded-md border border-red-200 text-red-600 hover:bg-red-50 transition-colors disabled:opacity-50">
              {{ deleting === region.id ? 'Deleting...' : 'Delete' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Create / Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
      <h2 class="text-base font-semibold text-gray-800">{{ editingId ? 'Edit Region' : 'New Region' }}</h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSave()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Region Name <span class="text-red-500">*</span></label>
        <input formControlName="name" type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          placeholder="e.g. Oromia"/>
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-xs text-red-600">Name is required</p>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving"
          class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-60">
          {{ saving ? 'Saving...' : (editingId ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
