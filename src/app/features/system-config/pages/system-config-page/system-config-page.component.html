<div class="min-h-full bg-gray-50">
  <div class="border-b border-gray-200 bg-white px-6 pt-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-4">Content Management</h1>
    <nav class="flex gap-1">
      <button
        *ngFor="let tab of tabs"
        (click)="setTab(tab.id)"
        class="px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 transition-colors"
        [ngClass]="activeTab === tab.id
          ? 'border-blue-600 text-blue-600 bg-blue-50'
          : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
      >
        {{ tab.label }}
      </button>
    </nav>
  </div>

  <div class="bg-white min-h-full">
    <app-organization-config-page  *ngIf="activeTab === 'organization'"></app-organization-config-page>
    <app-news-management-page     *ngIf="activeTab === 'news'"></app-news-management-page>
    <app-social-media-page        *ngIf="activeTab === 'social-media'"></app-social-media-page>
    <app-regions-management-page  *ngIf="activeTab === 'regions'"></app-regions-management-page>
  </div>
</div>
