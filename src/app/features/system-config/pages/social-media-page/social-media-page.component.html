<app-page-split-layout
  [showLeftTitle]="true"
  leftTitle="Social Media"
  [showRightTitle]="true"
  rightTitle="Link Detail"
  [rightItem]="selectedLink"
  [rightEmptyMessage]="'Select a link to view details.'"
  [showRightEditButton]="true"
  (rightEdit)="openEdit($event)"
>
  <ng-template #leftContent>
    <div class="p-4">
      <app-data-table
        [columns]="columns"
        [data]="links"
        [loading]="loading"
        [total]="total"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [showPagination]="true"
        [showIndex]="true"
        [rowClickable]="true"
        [showAddButton]="true"
        [showEditButton]="false"
        [showDeleteButton]="false"
        [rowActions]="rowActions"
        [noDataMessage]="'No social media links yet.'"
        (pageChange)="onPageChange($event)"
        (addClick)="openCreate()"
        (rowClick)="onView($event)"
      >
        <div extraTableHeader class="w-full min-w-0">
          <app-social-media-filter
            [(searchText)]="searchText"
            [(selectedPlatform)]="selectedPlatform"
            (filterChange)="onFilterChange()"
            (searchChange)="onSearch()"
            (clearFilters)="clearFilters()"
          ></app-social-media-filter>
        </div>
      </app-data-table>
    </div>
  </ng-template>

  <ng-template #rightContent let-link>
    <app-social-media-view [link]="link"></app-social-media-view>
  </ng-template>
</app-page-split-layout>

<!-- Create / Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800">{{ editingId ? 'Edit Link' : 'Add Social Media Link' }}</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSave()" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Platform *</label>
        <select formControlName="platform"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option *ngFor="let p of platforms" [value]="p">{{ p }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">URL *</label>
        <input formControlName="url" type="url"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="https://..." />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Display Order</label>
          <input formControlName="displayOrder" type="number"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input formControlName="visible" type="checkbox" class="rounded" />
            Visible on site
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()"
          class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving"
          class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
