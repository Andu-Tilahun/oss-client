<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-gray-800">Social Media Links</h2>
    <button (click)="openCreate()" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors">
      + Add Link
    </button>
  </div>

  <div *ngIf="error" class="mb-4 text-sm text-red-600">{{ error }}</div>
  <div *ngIf="loading" class="text-sm text-gray-500">Loading...</div>

  <div *ngIf="!loading" class="space-y-2">
    <div *ngFor="let link of links" class="flex items-center gap-4 p-3 border border-gray-200 rounded-lg bg-white">
      <span class="w-24 text-xs font-semibold text-gray-600 uppercase">{{ link.platform }}</span>
      <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="flex-1 text-sm text-blue-600 hover:underline truncate">{{ link.url }}</a>
      <span class="text-xs text-gray-400">order: {{ link.displayOrder }}</span>

      <button
        (click)="toggleVisible(link)"
        [disabled]="togglingId === link.id"
        class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium transition-colors"
        [ngClass]="link.visible ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'"
      >
        <span>{{ link.visible ? 'Visible' : 'Hidden' }}</span>
      </button>

      <button (click)="openEdit(link)" class="text-blue-600 hover:underline text-xs">Edit</button>
      <button (click)="onDelete(link.id)" [disabled]="deletingId === link.id" class="text-red-500 hover:underline text-xs disabled:opacity-50">
        {{ deletingId === link.id ? '...' : 'Delete' }}
      </button>
    </div>
    <p *ngIf="links.length === 0" class="text-sm text-gray-400 text-center py-6">No social media links yet.</p>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800">{{ editingId ? 'Edit Link' : 'Add Social Media Link' }}</h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSave()" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Platform *</label>
        <select formControlName="platform" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option *ngFor="let p of platforms" [value]="p">{{ p }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">URL *</label>
        <input formControlName="url" type="url" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://..." />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Display Order</label>
          <input formControlName="displayOrder" type="number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="flex items-end pb-2">
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input formControlName="visible" type="checkbox" class="rounded" />
            Visible on site
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()" class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
