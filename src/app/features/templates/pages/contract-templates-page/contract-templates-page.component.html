<app-page-split-layout
  [showLeftTitle]="true"
  [leftTitle]="'Contract Templates'"
  [showRightTitle]="true"
  [rightTitle]="selectedTemplate ? selectedTemplate.name : 'Template Preview'"
  [rightItem]="selectedTemplate"
  [rightEmptyMessage]="'Select a template from the table to preview it.'"
  [showRightEditButton]="false"
  [showRightCloseButton]="false"
>
  <ng-template #leftContent>
    <app-data-table
      [columns]="columns"
      [data]="templates"
      [loading]="loading"
      [total]="templates.length"
      [pageSize]="templates.length || 10"
      [showPagination]="false"
      [rowClickable]="true"
      [showAddButton]="true"
      [showRefreshButton]="false"
      [showEditButton]="false"
      [showDeleteButton]="false"
      [showActionColumn]="true"
      [showColumnPickerControl]="false"
      [rowActions]="rowActions"
      [noDataMessage]="'No contract templates yet.'"
      (rowClick)="onRowClick($event)"
      (addClick)="openCreate()"
    >
    </app-data-table>
  </ng-template>

  <ng-template #rightContent let-t>
    <div class="border border-gray-200 rounded-xl bg-white p-5 text-sm text-gray-700 whitespace-pre-line leading-relaxed font-mono"
         style="min-height:200px;max-height:600px;overflow-y:auto;">
      {{ t.body }}
    </div>
  </ng-template>
</app-page-split-layout>

<!-- Create / Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl my-6">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800">{{ editingId ? 'Edit' : 'New' }} Contract Template</h2>
      <button (click)="close()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form [formGroup]="form" (ngSubmit)="save()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Template Name <span class="text-red-500">*</span></label>
        <input formControlName="name" type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          placeholder="e.g. Investment Agreement"/>
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-xs text-red-600">Name is required</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Purpose</label>
        <select formControlName="purpose"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 bg-white">
          <option [ngValue]="null">— Select purpose —</option>
          <option *ngFor="let opt of purposeOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title / Subject</label>
        <input formControlName="subject" type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500"
          placeholder="e.g. Investment Agreement"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Body <span class="text-red-500">*</span></label>
        <textarea formControlName="body" rows="12"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-green-500 resize-y"
          [class.border-red-500]="form.get('body')?.invalid && form.get('body')?.touched"
          placeholder="Enter the contract body text here."></textarea>
        <p *ngIf="form.get('body')?.invalid && form.get('body')?.touched" class="mt-1 text-xs text-red-600">Body is required</p>
      </div>
      <div class="flex gap-6">
        <label class="flex items-center gap-2 cursor-pointer">
          <input formControlName="active" type="checkbox" class="w-4 h-4 accent-green-600"/>
          <span class="text-sm text-gray-700">Active</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input formControlName="defaultTemplate" type="checkbox" class="w-4 h-4 accent-green-600"/>
          <span class="text-sm text-gray-700">Set as default</span>
        </label>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="close()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="saving"
          class="px-5 py-2 bg-green-700 text-white rounded-lg text-sm font-medium hover:bg-green-800 disabled:opacity-60">
          {{ saving ? 'Saving...' : (editingId ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
