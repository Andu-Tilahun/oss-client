<app-page-split-layout
  [showLeftTitle]="true"
  [leftTitle]="'Email Templates'"
  [showRightTitle]="true"
  [rightTitle]="selectedTemplate ? selectedTemplate.name : 'Template Preview'"
  [rightItem]="selectedTemplate"
  [rightEmptyMessage]="'Select a template from the table to preview it.'"
  [showRightEditButton]="false"
  [showRightCloseButton]="false"
>
  <ng-template #leftContent>
    <app-data-table
      [columns]="columns"
      [data]="templates"
      [selectedRowId]="selectedTemplate?.id ?? null"
      [loading]="loading"
      [total]="templates.length"
      [pageSize]="templates.length || 10"
      [showPagination]="false"
      [rowClickable]="true"
      [rowDetailTemplate]="rightContent"
      [showAddButton]="true"
      [showRefreshButton]="false"
      [showEditButton]="false"
      [showDeleteButton]="false"
      [showActionColumn]="true"
      [showColumnPickerControl]="false"
      [rowActions]="rowActions"
      [noDataMessage]="'No email templates yet.'"
      (rowClick)="onRowClick($event)"
      (addClick)="openCreate()"
    >
    </app-data-table>
  </ng-template>

  <ng-template #rightContent let-t>
    <div class="border border-gray-200 rounded-xl overflow-y-auto bg-white"
         style="height:calc(100vh - 160px); height:calc(100dvh - 160px);"
         [innerHTML]="getPreviewHtml(t.body)">
    </div>
  </ng-template>
</app-page-split-layout>

<!-- Create / Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-start justify-center bg-black/40 p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl my-6">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800">{{ editingId ? 'Edit' : 'New' }} Email Template</h2>
      <button (click)="close()" class="text-gray-400 hover:text-gray-600 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="p-6 grid grid-cols-1 xl:grid-cols-2 gap-6">

        <!-- Left: form fields -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Template Name <span class="text-red-500">*</span></label>
            <input formControlName="name" type="text"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
              [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
              placeholder="e.g. User Invitation Email"/>
            <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-xs text-red-600">Name is required</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Purpose</label>
            <select formControlName="purpose"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white">
              <option [ngValue]="null">— Select purpose —</option>
              <option *ngFor="let opt of purposeOptions" [value]="opt.value">{{ opt.label }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input formControlName="subject" type="text"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="e.g. You are invited to AgriVest"/>
          </div>

          <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
              <input formControlName="active" type="checkbox" class="w-4 h-4 accent-green-600"/>
              <span class="text-sm text-gray-700">Active</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input formControlName="defaultTemplate" type="checkbox" class="w-4 h-4 accent-green-600"/>
              <span class="text-sm text-gray-700">Set as default</span>
            </label>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">HTML Body <span class="text-red-500">*</span></label>
            <textarea formControlName="body" rows="20"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-green-500 focus:border-green-500 resize-y"
              [class.border-red-500]="form.get('body')?.invalid && form.get('body')?.touched"
              placeholder="Paste or type your HTML email body here."></textarea>
            <p *ngIf="form.get('body')?.invalid && form.get('body')?.touched" class="mt-1 text-xs text-red-600">HTML body is required</p>
          </div>
        </div>

        <!-- Right: live preview -->
        <div class="flex flex-col">
          <label class="block text-sm font-medium text-gray-700 mb-1">Live Preview</label>
          <div class="flex-1 border border-gray-200 rounded-xl overflow-auto bg-white min-h-[500px] p-4"
               [innerHTML]="previewHtml">
          </div>
          <p class="text-xs text-gray-400 mt-2">Preview reflects the HTML body in real time.</p>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
        <button type="button" (click)="close()"
          class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50 transition">
          Cancel
        </button>
        <button type="submit" [disabled]="saving"
          class="px-5 py-2 bg-green-700 text-white rounded-lg text-sm font-medium hover:bg-green-800 disabled:opacity-60 transition">
          {{ saving ? 'Saving...' : (editingId ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
