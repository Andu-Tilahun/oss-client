<div class="max-w-2xl mx-auto p-4 md:p-0">
  <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-1">About</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Information about the organization behind AgriVest.</p>

  <div *ngIf="loading" class="text-sm text-gray-500 dark:text-gray-400 py-8 text-center">Loading…</div>

  <div *ngIf="!loading" class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-6">
    <div class="flex items-center gap-4 mb-5">
      <img *ngIf="logoUrl" [src]="logoUrl" alt="Logo" class="w-14 h-14 rounded-lg object-cover shrink-0" />
      <div *ngIf="!logoUrl" class="w-14 h-14 rounded-lg bg-emerald-700 flex items-center justify-center shrink-0">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-lg font-semibold text-gray-900 dark:text-gray-100 truncate">{{ orgConfig?.name || 'AgriVest' }}</p>
        <p *ngIf="orgConfig?.tagline" class="text-sm text-gray-500 dark:text-gray-400 truncate">{{ orgConfig?.tagline }}</p>
      </div>
    </div>

    <p *ngIf="orgConfig?.aboutUs" class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">{{ orgConfig?.aboutUs }}</p>
    <p *ngIf="!orgConfig?.aboutUs" class="text-sm text-gray-400 dark:text-gray-500 italic">No information has been added yet.</p>
  </div>
</div>
