<div class="max-w-2xl mx-auto p-4 md:p-0">
  <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-1">Contact</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">How to reach us.</p>

  <div *ngIf="loading" class="text-sm text-gray-500 dark:text-gray-400 py-8 text-center">Loading…</div>

  <div *ngIf="!loading" class="space-y-4">
    <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-6 space-y-4">
      <div class="flex items-start gap-3" *ngIf="orgConfig?.address">
        <svg class="w-5 h-5 text-emerald-700 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <p class="text-sm text-gray-700 dark:text-gray-300">{{ orgConfig?.address }}</p>
      </div>

      <div class="flex items-start gap-3" *ngIf="orgConfig?.operatingHours">
        <svg class="w-5 h-5 text-emerald-700 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm text-gray-700 dark:text-gray-300">{{ orgConfig?.operatingHours }}</p>
      </div>

      <div class="flex items-start gap-3" *ngIf="orgConfig?.phone || orgConfig?.contactMobilePhone">
        <svg class="w-5 h-5 text-emerald-700 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        <a [href]="phoneHref" class="text-sm text-gray-700 dark:text-gray-300 hover:text-emerald-700 dark:hover:text-emerald-400">
          {{ orgConfig?.phone || orgConfig?.contactMobilePhone }}
        </a>
      </div>

      <div class="flex items-start gap-3" *ngIf="orgConfig?.email">
        <svg class="w-5 h-5 text-emerald-700 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <a [href]="emailHref" class="text-sm text-gray-700 dark:text-gray-300 hover:text-emerald-700 dark:hover:text-emerald-400">
          {{ orgConfig?.email }}
        </a>
      </div>

      <div *ngIf="socialLinks.length > 0" class="flex items-center gap-3 pt-2 border-t border-gray-100 dark:border-gray-700">
        <a *ngFor="let link of socialLinks" [href]="link.url" target="_blank" rel="noopener"
           class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 hover:opacity-80 transition-opacity">
          <app-social-icon [platform]="link.platform" class="w-4 h-4"></app-social-icon>
        </a>
      </div>
    </div>

    <div *ngIf="branchCenters.length > 0" class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm p-6">
      <p class="text-sm font-medium text-gray-900 dark:text-gray-100 mb-3">Branches</p>
      <div class="space-y-3">
        <div *ngFor="let branch of branchCenters" class="text-sm">
          <p class="font-medium text-gray-800 dark:text-gray-200">{{ branch.name }}</p>
          <p *ngIf="branch.address" class="text-gray-500 dark:text-gray-400">{{ branch.address }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
