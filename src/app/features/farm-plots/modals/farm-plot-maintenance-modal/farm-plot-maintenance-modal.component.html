<app-modal
  [(visible)]="visible"
  title="Mark Under Maintenance"
  size="sm"
  confirmText="Mark Under Maintenance"
  cancelText="Cancel"
  [confirmLoading]="confirmLoading"
  [confirmDisabled]="!canConfirm"
  confirmButtonClass="bg-yellow-600 hover:bg-yellow-700 text-white"
  (confirm)="confirm.emit()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #modalBody>
    <div class="space-y-4 text-sm">
      <div>
        <p class="text-gray-500">You are about to mark this farm plot as under maintenance:</p>
        <p class="font-medium text-gray-900">{{ plotTitle || '-' }}</p>
        <p class="mt-1 text-xs text-amber-600">
          It will move to the Repair / Damaged tab until it's marked repaired.
        </p>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">Reason <span class="text-red-500">*</span></label>
        <textarea
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"
          rows="3"
          placeholder="Explain what's damaged or needs repair..."
          [ngModel]="reason"
          (ngModelChange)="reasonChange.emit($event)"
        ></textarea>
      </div>
    </div>
  </ng-template>
</app-modal>
