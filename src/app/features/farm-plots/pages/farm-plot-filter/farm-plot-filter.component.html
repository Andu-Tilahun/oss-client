<app-filter-bar
  [(searchText)]="searchText"
  (searchTextChange)="onSearchTextChange($event)"
  searchPlaceholder="Search farm plots..."
  applyLabel="Search"
  clearLabel="Clear Filters"
  (searchChange)="onSearch()"
  (clearFilters)="onClearFilters()"
>
  <div class="w-[150px]">
    <select
      [ngModel]="status"
      (ngModelChange)="onStatusChange($event)"
      class="w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700"
    >
      <option [ngValue]="''">Status: All</option>
      <option *ngFor="let s of statuses" [ngValue]="s">Status: {{ s }}</option>
    </select>
  </div>

  <div class="w-[150px]">
    <select
      [ngModel]="soilType"
      (ngModelChange)="onSoilTypeChange($event)"
      class="w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700"
    >
      <option [ngValue]="''">Soil: All</option>
      <option *ngFor="let s of soilTypes" [ngValue]="s">Soil: {{ s }}</option>
    </select>
  </div>

  <!-- <div class="w-[150px]">
    <select
      [ngModel]="sizeType"
      (ngModelChange)="onSizeTypeChange($event)"
      class="w-full px-3 py-1.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-slate-700"
    >
      <option [ngValue]="''">Size: All</option>
      <option *ngFor="let s of sizeTypes" [ngValue]="s">Size: {{ s }}</option>
    </select>
  </div> -->
</app-filter-bar>
