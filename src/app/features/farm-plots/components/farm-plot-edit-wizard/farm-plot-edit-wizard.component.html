<div class="grid grid-cols-1 lg:grid-cols-5 gap-8 items-start">
  <div class="lg:col-span-3 min-w-0">

    <!-- Step 1: Basic Info -->
    <div [hidden]="currentStep !== 1">
      <form [formGroup]="basicInfoForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Title <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="title"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="basicInfoForm.get('title')?.invalid && basicInfoForm.get('title')?.touched"
          />
          <p *ngIf="basicInfoForm.get('title')?.invalid && basicInfoForm.get('title')?.touched" class="mt-1 text-sm text-red-600">
            Title is required
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
          <textarea
            formControlName="description"
            rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Size <span class="text-red-500">*</span>
            </label>
            <input
              type="number"
              formControlName="size"
              min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="basicInfoForm.get('size')?.invalid && basicInfoForm.get('size')?.touched"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Size Type <span class="text-red-500">*</span>
            </label>
            <select
              formControlName="sizeType"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="basicInfoForm.get('sizeType')?.invalid && basicInfoForm.get('sizeType')?.touched"
            >
              <option value="">Select Size Type</option>
              <option *ngFor="let st of sizeTypes" [value]="st">{{ st }}</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- Step 2: Location & Classification -->
    <div [hidden]="currentStep !== 2">
      <form [formGroup]="locationForm" class="space-y-4">
        <app-coordinate-input
          formControlName="coordinates"
          [required]="true"
          [allowZeroCoordinates]="false"
        ></app-coordinate-input>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Soil Type <span class="text-red-500">*</span>
            </label>
            <select
              formControlName="soilType"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="locationForm.get('soilType')?.invalid && locationForm.get('soilType')?.touched"
            >
              <option value="">Select Soil Type</option>
              <option *ngFor="let st of soilTypes" [value]="st">{{ st }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Status <span *ngIf="isStatusEditable" class="text-red-500">*</span>
            </label>
            <select
              *ngIf="isStatusEditable; else lockedStatus"
              formControlName="status"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="locationForm.get('status')?.invalid && locationForm.get('status')?.touched"
            >
              <option *ngFor="let st of editableStatuses" [value]="st">{{ st }}</option>
            </select>
            <ng-template #lockedStatus>
              <span class="inline-block px-3 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm font-medium">
                {{ farmPlot.status }}
              </span>
              <p class="text-xs text-gray-500 mt-1">
                This status is managed automatically by lease/bidding/crowdfunding/investment workflows and can't be changed here.
              </p>
            </ng-template>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Region <span class="text-red-500">*</span>
          </label>
          <select
            formControlName="regionId"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="locationForm.get('regionId')?.invalid && locationForm.get('regionId')?.touched"
          >
            <option value="">{{ regionsLoading ? 'Loading regions...' : 'Select Region' }}</option>
            <option *ngFor="let r of regions" [value]="r.id">{{ r.name }}</option>
          </select>
          <p *ngIf="locationForm.get('regionId')?.invalid && locationForm.get('regionId')?.touched" class="mt-1 text-sm text-red-600">
            Region is required
          </p>
        </div>
      </form>
    </div>

    <!-- Step 3: Media -->
    <div [hidden]="currentStep !== 3" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Plot Image</label>
        <app-profile-picture-upload
          #mainImageUpload
          [currentFileId]="farmPlot.imageUuid"
          [deferUpload]="false"
          [showInlineUploadButton]="false"
          size="large"
          (fileUploaded)="onImageUploaded($event)"
          (fileRemoved)="onImageRemoved()"
        ></app-profile-picture-upload>
      </div>

      <div class="space-y-3">
        <input
          #galleryFileInput
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onGalleryFileSelected($event)"
        />

        <div class="flex items-center justify-between">
          <label class="block text-sm font-medium text-gray-700">Gallery Images</label>
          <button
            type="button"
            class="rounded bg-blue-600 px-3 py-1 text-xs font-semibold text-white hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed"
            [disabled]="galleryUploading"
            (click)="triggerGalleryFileInput(galleryFileInput)"
          >
            {{ galleryUploading ? 'Uploading...' : 'Add Image' }}
          </button>
        </div>

        <p *ngIf="galleryImages.length === 0" class="text-xs text-gray-500">No gallery images yet.</p>

        <div *ngIf="galleryImages.length > 0" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div
            *ngFor="let image of galleryImages; let i = index"
            class="min-w-0 rounded-lg border border-gray-200 p-2"
          >
            <div class="mb-2 flex items-center justify-between gap-1">
              <span class="text-xs text-gray-600 truncate">Image {{ i + 1 }}</span>
              <button
                type="button"
                class="shrink-0 text-xs font-semibold text-rose-600 hover:text-rose-700"
                (click)="removeGallerySlot(i)"
              >
                Remove
              </button>
            </div>
            <img
              [src]="image.previewUrl"
              [alt]="'Gallery image ' + (i + 1)"
              class="w-full h-24 object-cover rounded-lg border border-gray-200 cursor-pointer"
              (click)="openGalleryPreview(image.previewUrl)"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="lg:col-span-2 lg:sticky lg:top-0 lg:self-start min-h-0">
    <div class="lg:max-h-[65vh] overflow-y-auto pr-1">
      <app-farm-plot-preview [data]="previewData"></app-farm-plot-preview>
    </div>
  </div>
</div>
