<app-detail-card>
  <div *ngIf="loading" class="animate-pulse space-y-8" aria-label="Loading farm plot">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div class="space-y-2">
        <div class="h-7 w-64 rounded bg-gray-200"></div>
        <div class="h-4 w-80 rounded bg-gray-100"></div>
      </div>
      <div class="h-6 w-28 rounded-full bg-gray-200"></div>
    </div>

    <hr class="border-gray-200" />

    <div class="space-y-4">
      <div class="h-5 w-52 rounded bg-gray-200"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <div class="h-3 w-24 rounded bg-gray-100"></div>
          <div class="h-4 w-40 rounded bg-gray-200"></div>
        </div>
        <div class="space-y-2">
          <div class="h-3 w-24 rounded bg-gray-100"></div>
          <div class="h-4 w-40 rounded bg-gray-200"></div>
        </div>
        <div class="space-y-2">
          <div class="h-3 w-24 rounded bg-gray-100"></div>
          <div class="h-4 w-40 rounded bg-gray-200"></div>
        </div>
        <div class="space-y-2">
          <div class="h-3 w-24 rounded bg-gray-100"></div>
          <div class="h-4 w-40 rounded bg-gray-200"></div>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <div class="h-5 w-20 rounded bg-gray-200"></div>
      <div class="h-28 w-full rounded bg-gray-100"></div>
    </div>

    <div class="space-y-4">
      <div class="h-5 w-28 rounded bg-gray-200"></div>
      <div class="h-[300px] w-full rounded bg-gray-100"></div>
    </div>
  </div>
  <div *ngIf="error && !loading" class="text-sm text-red-600">{{ error }}</div>
  <div *ngIf="!plot && !loading" class="text-sm text-gray-500">No farm plot selected.</div>

  <ng-container *ngIf="plot && !loading">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-8">
      <div>
        <h3 class="text-2xl font-bold text-gray-900">{{ plot.title }}</h3>
        <p *ngIf="plot.description" class="mt-1 text-sm text-gray-500">{{ plot.description }}</p>
      </div>

      <span
        *ngIf="plot.status"
        class="inline-flex items-center rounded-full border px-3 py-1 text-xs font-medium"
        [ngClass]="statusPillClass(plot.status)"
      >
        {{ plot.status }}
      </span>
    </div>

    <hr class="border-gray-200 mb-8" />

    <app-detail-section title="Farm Plot Information">
      <!-- <app-detail-field label="Title" [value]="plot.title" /> -->
      <!-- <app-detail-field label="Status" [value]="plot.status" /> -->
      <app-detail-field
        label="Size"
        [value]="plot.size + ' ' + (plot.sizeType === 'HECTARES' ? 'H' : (plot.sizeType === 'ACRES' ? 'A' : plot.sizeType))"
      />
      <app-detail-field label="Soil Type" [value]="plot.soilType" />
      <app-detail-field label="Latitude" [value]="plot.latitude" />
      <app-detail-field label="Longitude" [value]="plot.longitude" />
      <!-- <app-detail-field label="Description" [value]="plot.description || '-'" /> -->
    </app-detail-section>

    <app-detail-section >
      <div class="col-span-full space-y-4">
        <!-- <div *ngIf="getMainImageUrl(); else noMainImage">
          <p class="text-sm font-medium text-gray-700 mb-2">Plot Image</p>
          <img
            [src]="getMainImageUrl()!"
            [alt]="plot.title"
            class="max-h-48 rounded-lg border border-gray-200 object-cover cursor-pointer"
            (click)="openImagePreview(getMainImageUrl()!)"
          />
        </div> -->
        <ng-template #noMainImage>
          <p class="text-sm text-gray-500">No plot image available.</p>
        </ng-template>

        <div *ngIf="galleryLoading" class="text-sm text-gray-500">Loading gallery...</div>
        <div *ngIf="!galleryLoading">
          <p class="text-sm font-medium text-gray-700 mb-2">Gallery</p>
          <div class="grid grid-cols-4 gap-3">
            <ng-container *ngFor="let _ of [0, 1, 2]; let i = index">
              <img
                *ngIf="previewGalleryUrls[i] as url"
                [src]="url"
                [alt]="'Gallery image ' + (i + 1)"
                class="w-full h-24 object-cover rounded-lg border border-gray-200 cursor-pointer"
                (click)="openGallery(i)"
              />
              <div
                *ngIf="!previewGalleryUrls[i]"
                class="w-full h-24 rounded-lg border border-gray-100 bg-gray-50"
                aria-hidden="true"
              ></div>
            </ng-container>
            <button
              *ngIf="allowGalleryUpload"
              type="button"
              class="w-full h-24 flex items-center justify-center rounded-lg border-2 border-dashed border-gray-300 text-gray-400 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="galleryUploading"
              (click)="openGalleryUpload()"
              aria-label="Add gallery image"
            >
              <span class="text-2xl leading-none">+</span>
            </button>
          </div>
        </div>

        <button
          *ngIf="showCreateLeaseButton"
          type="button"
          (click)="onCreateLease()"
          class="px-4 py-2 rounded-lg bg-blue-500 text-white text-sm font-medium hover:bg-blue-600 transition-colors"
        >
          {{ createLeaseButtonText }}
        </button>
      </div>
    </app-detail-section>

    <app-detail-section *ngIf="plot.latitude != null && plot.longitude != null" title="Location Map">
      <div class="col-span-full">
        <app-oss-map
          [interactive]="false"
          [height]="'300px'"
          [zoom]="10"
          [latitude]="plot.latitude"
          [longitude]="plot.longitude"
          [locations]="[{ lat: plot.latitude, lng: plot.longitude, name: plot.title }]"
          [fitBounds]="true"
        ></app-oss-map>
      </div>
    </app-detail-section>

  </ng-container>

  <!-- fallback handled by the "No farm plot selected" block above -->
</app-detail-card>

<app-image-gallery-modal
  [(visible)]="showGalleryModal"
  [loading]="galleryLoading"
  [title]="galleryTitle"
  [imageUrls]="allGalleryUrls"
  [initialIndex]="galleryModalInitialIndex"
></app-image-gallery-modal>

<app-image-upload-modal
  [(visible)]="showUploadModal"
  title="Add Gallery Image"
  (fileUploaded)="onGalleryImageUploaded($event)"
  (uploadError)="onGalleryUploadError($event)"
></app-image-upload-modal>
