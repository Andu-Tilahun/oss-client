<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Edit Profile</h1>
    <a routerLink="/home" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">Back</a>
  </div>

  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 sm:p-6" *ngIf="currentUser as user">
    <div class="flex flex-col items-center text-center mb-6 pb-6 border-b border-gray-100">
      <app-profile-picture-upload
        [currentFileId]="user.profileImageUuid"
        [viewOnly]="true"
        size="large"
      ></app-profile-picture-upload>
      <button
        type="button"
        (click)="openProfileImageModal()"
        class="mt-4 px-4 py-2 text-sm font-medium text-indigo-600 border border-indigo-200 rounded-lg hover:bg-indigo-50 transition-colors"
      >
        Change photo
      </button>
    </div>

    <app-user-form
      #userForm
      mode="edit"
      [user]="user"
      [profileUpdate]="true"
      [profileImageInline]="false"
    ></app-user-form>

    <div class="mt-6 flex justify-end gap-3">
      <a routerLink="/home" class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50">Cancel</a>
      <button
        type="button"
        (click)="saveProfile()"
        [disabled]="isSaving"
        class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>

<app-profile-image-upload-modal
  [(visible)]="profileImageModalOpen"
  [currentFileId]="currentUser?.profileImageUuid"
  [uploadUrl]="profileImageUploadUrl"
  (fileUploaded)="onProfileImageUploaded($event)"
  (uploadError)="onProfileImageUploadError($event)"
/>
