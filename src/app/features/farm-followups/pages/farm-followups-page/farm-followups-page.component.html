<app-page-split-layout
  [showLeftTitle]="true"
  [showRightTitle]="true"
  leftTitle="Farm Plots Under Maintenance"
  rightTitle="Restoration Follow-up"
  [rightItem]="selectedPlot"
  [rightEmptyMessage]="'Select a farm plot to view its restoration follow-up.'"
  [showRightEditButton]="false"
>
  <ng-template #leftContent>
    <app-data-table
      [columns]="columns"
      [data]="visiblePlots"
      [loading]="loading"
      [total]="visiblePlots.length"
      [pageSize]="visiblePlots.length || 10"
      [pageIndex]="1"
      [showColumnPickerControl]="false"
      [showAddButton]="false"
      [showRefreshButton]="false"
      [showViewButton]="false"
      [showEditButton]="false"
      [showDeleteButton]="false"
      [showActionColumn]="false"
      [rowClickable]="true"
      [noDataMessage]="'No farm plots are currently under maintenance.'"
      (rowClick)="selectPlot($event)"
    ></app-data-table>
  </ng-template>

  <ng-template #rightContent>
    <app-restoration-plan-view
      [plot]="selectedPlot"
      [plan]="selectedPlan"
      [isAdmin]="isAdmin"
      [isExtensionWorker]="isExtensionWorker"
      [currentUserId]="currentUserId"
      [currentUser]="currentUser"
      [workers]="workers"
      (assignRequested)="onAssignRequested()"
      (updated)="onPlanChanged()"
    ></app-restoration-plan-view>
  </ng-template>
</app-page-split-layout>

<app-restoration-plan-assign-modal
  [(visible)]="showAssignModal"
  [farmPlotId]="selectedPlot?.id ?? null"
  [existingPlanId]="selectedPlan?.id ?? null"
  (assigned)="onPlanChanged()"
></app-restoration-plan-assign-modal>
