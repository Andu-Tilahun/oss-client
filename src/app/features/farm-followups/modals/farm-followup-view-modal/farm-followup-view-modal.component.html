<app-modal
  [(visible)]="visible"
  title="Follow-up detail"
  size="lg"
  [showFooter]="false"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #modalBody>
    <app-farm-followup-view
      [followUp]="followUp"
      [readOnly]="readOnly"
      [canAct]="canAct"
      (outcomeRequested)="outcomeRequested.emit($event)"
    ></app-farm-followup-view>
  </ng-template>
</app-modal>
