<app-modal
  [(visible)]="visible"
  [title]="title"
  size="sm"
  [confirmText]="confirmText"
  cancelText="Cancel"
  [confirmLoading]="confirmLoading"
  [confirmDisabled]="!canConfirm"
  [confirmButtonClass]="confirmButtonClass"
  (confirm)="confirm.emit()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #modalBody>
    <div class="space-y-4 text-sm">
      <div>
        <p class="text-gray-500">Follow-up reference:</p>
        <p class="font-mono font-medium text-gray-900">{{ followUpReference || '-' }}</p>
      </div>

      <div
        *ngIf="isAdminActingOnBehalf"
        class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-700"
      >
        <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        You're completing this on behalf of the assigned extension worker — this will be recorded.
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">Reason <span class="text-red-500">*</span></label>
        <textarea
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"
          rows="3"
          [placeholder]="action === 'DONE' ? 'Explain what was completed...' : 'Explain why this follow-up is being excluded...'"
          [ngModel]="reason"
          (ngModelChange)="reasonChange.emit($event)"
        ></textarea>
      </div>
    </div>
  </ng-template>
</app-modal>
