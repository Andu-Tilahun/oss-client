<app-modal
  [(visible)]="visible"
  title="Edit Lease Agreement"
  size="xl"
  [confirmText]="'Update Lease Agreement'"
  [confirmLoading]="isLoading"
  (confirm)="onSubmit()"
  (cancel)="onCancel()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #modalBody>
    <app-investment-package-type-form
      #investmentPackageTypeForm
      mode="edit"
      [agreement]="agreement"
    ></app-investment-package-type-form>
  </ng-template>
</app-modal>
