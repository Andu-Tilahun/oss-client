<app-modal
  [(visible)]="visible"
  [title]="title"
  size="sm"
  confirmText="Close Package"
  cancelText="Cancel"
  [confirmLoading]="confirmLoading"
  [confirmDisabled]="!canConfirm"
  (confirm)="confirm.emit()"
  (visibleChange)="visibleChange.emit($event)"
>
  <ng-template #modalBody>
    <div class="space-y-4 text-sm">
      <div>
        <p class="text-gray-500">You are about to close:</p>
        <p class="font-medium text-gray-900">{{ packageTitle || '-' }}</p>
        <p class="mt-1 text-xs text-amber-600">
          This deactivates the package. It will remain visible as closed history on the farm plot and package detail pages.
        </p>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">Reason <span class="text-red-500">*</span></label>
        <textarea
          class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"
          rows="3"
          placeholder="Explain why this investment package is being closed..."
          [ngModel]="reason"
          (ngModelChange)="reasonChange.emit($event)"
        ></textarea>
      </div>
    </div>
  </ng-template>
</app-modal>
