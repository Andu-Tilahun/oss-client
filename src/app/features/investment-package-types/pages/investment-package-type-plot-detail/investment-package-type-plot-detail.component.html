<div [class.max-w-5xl]="!embedded" [class.mx-auto]="!embedded" [class.px-4]="!embedded" [class.sm:px-6]="!embedded" [class.py-6]="!embedded">
  <div *ngIf="!embedded" class="flex items-center justify-between mb-5">
    <h1 class="text-xl font-bold text-gray-900">{{ pageHeading }}</h1>
    <a
      [routerLink]="listRoute"
      class="text-sm font-medium text-indigo-600 hover:text-indigo-800"
    >
      Back
    </a>
  </div>

  <ng-container *ngIf="mode === 'plot'">
    <app-farm-plot-view
      [id]="plot ? undefined : plotId"
      [plot]="plot"
      [showCreateLeaseButton]="showPlotCreateLeaseButton"
      (createLease)="openCreatePackageTypeFromPlot()"
    ></app-farm-plot-view>
  </ng-container>

  <ng-container *ngIf="mode === 'lease'">
    <div *ngIf="loading" class="text-sm text-gray-600">Loading package detail...</div>
    <div *ngIf="error && !loading" class="text-sm text-red-600">{{ error }}</div>

    <app-investment-package-detail-panel
      *ngIf="effectiveAgreement && !loading"
      [investmentPackage]="asInvestmentPackage(effectiveAgreement)"
      [refreshKey]="effectiveRefreshKey"
      [tabs]="effectiveTabs"
      [forcedTab]="forcedTab"
      [packageInvestments]="effectivePackageInvestments"
      [packageInvestmentsLoading]="effectivePackageInvestmentsLoading"
      (tabChange)="onTabChange($event)"
      (extensionWorkerAssigned)="onExtensionWorkerAssigned($event)"
      (candidatesChosen)="onCandidatesChosen()"
      (agreementCreated)="onAgreementCreated()"
    ></app-investment-package-detail-panel>
  </ng-container>
</div>

<app-investment-package-type-create-modal
  *ngIf="isInvestor && mode === 'plot' && !embedded"
  [(visible)]="showCreateModal"
  [selectedFarmPlot]="farmPlot"
  (packageTypeCreated)="onPackageTypeCreated()"
></app-investment-package-type-create-modal>
