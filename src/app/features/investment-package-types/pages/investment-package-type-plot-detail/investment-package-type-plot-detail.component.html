<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-xl font-bold text-gray-900">Farm Plot Detail</h1>
    <a
      routerLink="/investment-package-types/leasing"
      class="text-sm font-medium text-indigo-600 hover:text-indigo-800"
    >
      Back
    </a>
  </div>

  <app-farm-plot-view
    [id]="plotId"
    [showCreateLeaseButton]="showCreatePackageTypeCta"
    (createLease)="openCreatePackageTypeFromPlot()"
  ></app-farm-plot-view>
</div>

<app-investment-package-type-create-modal
  *ngIf="isInvestor"
  [(visible)]="showCreateModal"
  [selectedFarmPlot]="farmPlot"
  (packageTypeCreated)="onPackageTypeCreated()"
></app-investment-package-type-create-modal>
