<app-page-split-layout
  [showLeftTitle]="true"
  [showRightTitle]="true"
  [leftTitle]="pageTitle"
  [rightTitle]="rightPanelTitle"
  [rightItem]="rightPanelItem"
  [rightEmptyMessage]="'Select a row to view details.'"
  [showRightEditButton]="!!selectedAgreement && shouldShowPackageTypeEditButton(selectedAgreement)"
  [rightActions]="[]"
  (rightEdit)="onEdit($event)"
>
  <ng-template #leftContent>
    <div class="space-y-8">
      <!-- Section 1: Leases -->
      <section>
        <h3 *ngIf="isInvestorUser" class="text-base font-semibold text-gray-900 mb-3">My farm leases</h3>
        <app-data-table
          [columns]="columns"
          [data]="packageTypes"
          [loading]="loading"
          [total]="total"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex"
          [showColumnPickerControl]="false"
          [showAddButton]="false"
          [showRefreshButton]="!isInvestorUser"
          [showViewButton]="false"
          [showEditButton]="false"
          [showDeleteButton]="false"
          [showActionColumn]="true"
          [rowActions]="tableRowActions"
          [actionCellLabel]="isAdmin ? getAdminActionCellLabel : undefined"
          [rowClickable]="true"
          (pageChange)="onPageChange($event)"
          (refreshClick)="onRefresh()"
          (rowClick)="onView($event)"
        >
          <div extraTableHeader class="w-full min-w-0" *ngIf="myRequest">
            <app-investment-package-type-filter
              [(searchText)]="searchText"
              [(status)]="fundingStatus"
              [(paymentStatus)]="paymentStatus"
              (filterChange)="onFilterChange()"
              (searchChange)="onFilterChange()"
              (clearFilters)="clearFilters()"
            ></app-investment-package-type-filter>
          </div>
        </app-data-table>
      </section>

      <!-- Section 2 (investors): plots below the table -->
      <section *ngIf="isInvestorUser" class="border-t border-gray-200 pt-6 space-y-4 flex flex-col items-center">
        <div class="flex justify-center">
          <h3 class="text-base font-semibold text-gray-900">Explore More Farm Plots</h3>
        </div>

        <app-farm-plot-filter
          [showSearch]="true"
          [showStatus]="false"
          [(searchText)]="investorPlotSearchText"
          [(soilType)]="investorPlotSoilType"
          [(sizeType)]="investorPlotSizeType"
          (filterChange)="onInvestorPlotSearch()"
          (searchChange)="onInvestorPlotSearch()"
          (clearFilters)="onInvestorPlotClearFilters()"
        ></app-farm-plot-filter>

        <div class="[&_.bg-white]:!bg-transparent">
          <app-data-card-layout
            [data]="investorFarmPlots"
            [loading]="investorPlotsLoading"
            [total]="investorFarmPlots.length"
            [pageSize]="investorFarmPlots.length || 10"
            [pageIndex]="1"
            [showAddButton]="false"
            [showRefreshButton]="false"
            [showDownloadButton]="false"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="false"
            [titleAccessor]="getInvestorPlotCardTitle"
            [showCreatedDate]="false"
            [thumbnailUrlAccessor]="getInvestorPlotThumbnailUrl"
            [thumbnailAltAccessor]="getInvestorPlotThumbnailAlt"
            [cardClickEnabled]="true"
            (cardClick)="onChoosePlot($event)"
            [noDataMessage]="'No available plots found.'"
          >
            <ng-template cardHeaderRightTemplate let-plot>
              <button
                type="button"
                class="action-link action-link--view p-1 ml-2"
                aria-label="View plot details"
                title="View"
                (click)="onViewPlot(plot, $event)"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z"></path>
                </svg>
              </button>
            </ng-template>
          </app-data-card-layout>
        </div>
      </section>

      <app-previously-managed-investment-package-type-farm-plots *ngIf="isExtensionWorkerUser"></app-previously-managed-investment-package-type-farm-plots>
    </div>
  </ng-template>

  <ng-template #rightContent let-item>
    <app-investment-package-type-plot-detail
      *ngIf="selectedAgreement"
      mode="lease"
      [embedded]="true"
      [agreement]="item"
      [investmentPackageType]="investmentPackageType"
      [refreshKey]="detailRefreshKey"
      [tabs]="tabs"
      [forcedTab]="pendingForcedTab"
      [packageInvestments]="packageInvestments"
      [packageInvestmentsLoading]="packageInvestmentsLoading"
      (tabChange)="onTabChange($event)"
      (extensionWorkerAssigned)="onExtensionWorkerAssigned($event)"
      (candidatesChosen)="onCandidatesChosen()"
      (agreementCreated)="onAgreementCreated()"
    ></app-investment-package-type-plot-detail>

    <app-investment-package-type-plot-detail
      *ngIf="!selectedAgreement && plot"
      mode="plot"
      [embedded]="true"
      [plot]="plot"
      [investmentPackageType]="investmentPackageType"
      [showCreateLeaseButton]="true"
      (createLease)="openCreatePackageTypeFromPreview()"
    ></app-investment-package-type-plot-detail>
  </ng-template>
</app-page-split-layout>

<app-investment-package-type-create-modal
  [(visible)]="showCreateModal"
  [selectedFarmPlot]="plot"
  (packageTypeCreated)="onPackageTypeCreated()"
></app-investment-package-type-create-modal>

<app-investment-package-type-edit-modal
  [(visible)]="showEditModal"
  [agreement]="selectedAgreement"
  (packageTypeUpdated)="onPackageTypeUpdated()"
></app-investment-package-type-edit-modal>

<app-investment-package-type-admin-action-modal
  [(visible)]="showAdminActionModal"
  [agreement]="selectedAgreement"
  (decisionSelected)="onAdminDecision($event)"
></app-investment-package-type-admin-action-modal>

<app-investment-package-create-investment-modal
  [(visible)]="showCreateInvestmentModal"
  [investmentPackage]="asInvestmentPackage(selectedAgreement)"
  [leasePaymentMode]="true"
  (investmentCreated)="onInvestmentCreated()"
></app-investment-package-create-investment-modal>

<app-investment-package-edit-modal
  [(visible)]="showEditInvestmentPackageModal"
  [investmentPackage]="asInvestmentPackage(selectedAgreement)"
  (investmentPackageUpdated)="onInvestmentPackageUpdated()"
></app-investment-package-edit-modal>

<app-confirmation-modal
  [(visible)]="showDeleteModal"
  title="Delete Investment Package"
  [message]="'Are you sure you want to delete this investment package?'"
  type="warning"
  confirmText="Delete"
  [confirmLoading]="deleting"
  (confirm)="handleDeleteConfirmation()"
></app-confirmation-modal>

<app-modal
  [(visible)]="showContractModal"
  title="Lease Contract Preview"
  [size]="'xxl'"
  [confirmText]="'Download PDF'"
  [cancelText]="'Close'"
  [confirmLoading]="contractLoading"
  [confirmDisabled]="contractLoading || !contractHtml"
  (confirm)="onDownloadContractFile()"
>
  <ng-template #modalBody>
    <div *ngIf="contractLoading" class="text-center py-8 text-gray-600">
      Loading contract...
    </div>
    <iframe
      *ngIf="!contractLoading"
      class="w-full h-[70vh] border border-gray-200 rounded-md bg-white"
      [attr.srcdoc]="contractHtml"
      title="Lease Contract Preview"
    ></iframe>
  </ng-template>
</app-modal>
