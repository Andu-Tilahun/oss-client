<app-page-split-layout
  [showLeftTitle]="true"
  [showRightTitle]="true"
  [leftTitle]="pageTitle"
  [rightTitle]="rightPanelTitle"
  [rightItem]="rightPanelItem"
  [rightEmptyMessage]="'Select a row to view details.'"
  [showRightEditButton]="!!selectedAgreement && shouldShowPackageTypeEditButton(selectedAgreement)"
  [rightActions]="[]"
  (rightEdit)="onEdit($event)"
>
  <ng-template #leftContent>
    <!-- Investor: tabbed view -->
    <ng-container *ngIf="isInvestorUser; else staffSections">
      <app-tabs
        [tabs]="investorTabs"
        [activeTab]="investorActiveTab"
        [centered]="true"
        (activeTabChange)="onInvestorTabChange($event)"
      >
        <!-- Tab 1: My Farm Leases -->
        <div *ngIf="investorActiveTab === 'my-leases'">
          <app-data-table
            [columns]="columns"
            [data]="subscribedPackageTypes"
            [loading]="subscribedLoading"
            [total]="subscribedPackageTypes.length"
            [pageSize]="subscribedPackageTypes.length || 10"
            [pageIndex]="1"
            [showColumnPickerControl]="false"
            [showAddButton]="false"
            [showRefreshButton]="false"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="false"
            [showActionColumn]="true"
            [rowActions]="tableRowActions"
            [rowClickable]="true"
            (rowClick)="onView($event)"
          >
            <div extraTableHeader class="w-full min-w-0">
              <app-investment-package-type-filter
                [(searchText)]="searchText"
                [(status)]="fundingStatus"
                [(paymentStatus)]="paymentStatus"
                (filterChange)="onFilterChange()"
                (searchChange)="onFilterChange()"
                (clearFilters)="clearFilters()"
              ></app-investment-package-type-filter>
            </div>
          </app-data-table>
        </div>

        <!-- Tab 2: Explore More Farm Plots -->
        <div *ngIf="investorActiveTab === 'explore'">
          <app-data-table
            [columns]="columns"
            [data]="availablePackageTypes"
            [loading]="availableLoading"
            [total]="availableTotal"
            [pageSize]="availablePageSize"
            [pageIndex]="availablePageIndex"
            [showColumnPickerControl]="false"
            [showAddButton]="false"
            [showRefreshButton]="false"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="false"
            [showActionColumn]="true"
            [rowActions]="tableRowActions"
            [rowClickable]="true"
            [noDataMessage]="'No available investment packages found.'"
            (pageChange)="onAvailablePageChange($event)"
            (rowClick)="onView($event)"
          >
            <div extraTableHeader class="w-full min-w-0">
              <app-investment-package-type-filter
                [(searchText)]="availableSearchText"
                (filterChange)="onAvailableFilterChange()"
                (searchChange)="onAvailableFilterChange()"
                (clearFilters)="clearAvailableFilters()"
              ></app-investment-package-type-filter>
            </div>
          </app-data-table>
        </div>
      </app-tabs>
    </ng-container>

    <!-- Admin / extension worker -->
    <ng-template #staffSections>
      <!-- Admin: two-tab view (Published / Archived) -->
      <ng-container *ngIf="isAdmin; else nonAdminStaff">
        <app-tabs
          [tabs]="adminTabs"
          [activeTab]="adminActiveTab"
          [centered]="true"
          (activeTabChange)="onAdminTabChange($event)"
        >
          <!-- Tab 1: Published Investments -->
          <div *ngIf="adminActiveTab === 'published'">
            <app-data-table
              [columns]="columns"
              [data]="publishedPackages"
              [loading]="subscribedLoading"
              [total]="publishedPackages.length"
              [pageSize]="publishedPackages.length || 10"
              [pageIndex]="1"
              [showColumnPickerControl]="false"
              [showAddButton]="false"
              [showRefreshButton]="true"
              [showViewButton]="false"
              [showEditButton]="false"
              [showDeleteButton]="false"
              [showActionColumn]="true"
              [rowActions]="tableRowActions"
              [actionCellLabel]="getAdminActionCellLabel"
              [rowClickable]="true"
              (refreshClick)="onRefresh()"
              (rowClick)="onView($event)"
            >
              <div extraTableHeader class="w-full min-w-0">
                <app-investment-package-type-filter
                  [(searchText)]="searchText"
                  [(status)]="fundingStatus"
                  [(paymentStatus)]="paymentStatus"
                  (filterChange)="onFilterChange()"
                  (searchChange)="onFilterChange()"
                  (clearFilters)="clearFilters()"
                ></app-investment-package-type-filter>
              </div>
            </app-data-table>
          </div>

          <!-- Tab 2: Archived Investments -->
          <div *ngIf="adminActiveTab === 'archived'">
            <app-data-table
              [columns]="archivedColumns"
              [data]="archivedPackages"
              [loading]="subscribedLoading"
              [total]="archivedPackages.length"
              [pageSize]="archivedPackages.length || 10"
              [pageIndex]="1"
              [showColumnPickerControl]="false"
              [showAddButton]="false"
              [showRefreshButton]="false"
              [showViewButton]="false"
              [showEditButton]="false"
              [showDeleteButton]="false"
              [showActionColumn]="true"
              [rowActions]="tableRowActions"
              [rowClickable]="true"
              [noDataMessage]="'No archived investment packages found.'"
              (rowClick)="onView($event)"
            >
              <div extraTableHeader class="w-full min-w-0">
                <app-investment-package-type-filter
                  [(searchText)]="searchText"
                  [(status)]="fundingStatus"
                  [(paymentStatus)]="paymentStatus"
                  (filterChange)="onFilterChange()"
                  (searchChange)="onFilterChange()"
                  (clearFilters)="clearFilters()"
                ></app-investment-package-type-filter>
              </div>
            </app-data-table>
          </div>
        </app-tabs>
      </ng-container>

      <!-- Extension worker: plain list, no tabs -->
      <ng-template #nonAdminStaff>
        <section>
          <app-data-table
            [columns]="columns"
            [data]="subscribedPackageTypes"
            [loading]="subscribedLoading"
            [total]="subscribedPackageTypes.length"
            [pageSize]="subscribedPackageTypes.length || 10"
            [pageIndex]="1"
            [showColumnPickerControl]="false"
            [showAddButton]="false"
            [showRefreshButton]="true"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="false"
            [showActionColumn]="true"
            [rowActions]="tableRowActions"
            [rowClickable]="true"
            (refreshClick)="onRefresh()"
            (rowClick)="onView($event)"
          >
            <div extraTableHeader class="w-full min-w-0" *ngIf="myRequest">
              <app-investment-package-type-filter
                [(searchText)]="searchText"
                [(status)]="fundingStatus"
                [(paymentStatus)]="paymentStatus"
                (filterChange)="onFilterChange()"
                (searchChange)="onFilterChange()"
                (clearFilters)="clearFilters()"
              ></app-investment-package-type-filter>
            </div>
          </app-data-table>
        </section>
        <app-previously-managed-investment-package-type-farm-plots *ngIf="isExtensionWorkerUser"></app-previously-managed-investment-package-type-farm-plots>
      </ng-template>
    </ng-template>
  </ng-template>

  <ng-template #rightContent let-item>
    <app-investment-package-type-plot-detail
      *ngIf="selectedAgreement"
      mode="lease"
      [embedded]="true"
      [agreement]="item"
      [investmentPackageType]="investmentPackageType"
      [refreshKey]="detailRefreshKey"
      [tabs]="tabs"
      [forcedTab]="pendingForcedTab"
      [packageInvestments]="packageInvestments"
      [packageInvestmentsLoading]="packageInvestmentsLoading"
      [biddingLeaderboard]="biddingLeaderboard"
      (tabChange)="onTabChange($event)"
      (extensionWorkerAssigned)="onExtensionWorkerAssigned($event)"
      (candidatesChosen)="onCandidatesChosen()"
      (agreementCreated)="onAgreementCreated()"
      (investClicked)="onDetailPanelInvestClicked()"
      (agreementStatusChanged)="selectedAgreementStatus = $event"
    ></app-investment-package-type-plot-detail>
  </ng-template>
</app-page-split-layout>

<app-investment-package-type-create-modal
  [(visible)]="showCreateModal"
  (packageTypeCreated)="onPackageTypeCreated()"
></app-investment-package-type-create-modal>

<app-investment-package-type-edit-modal
  [(visible)]="showEditModal"
  [agreement]="selectedAgreement"
  (packageTypeUpdated)="onPackageTypeUpdated()"
></app-investment-package-type-edit-modal>

<app-investment-package-create-investment-modal
  [(visible)]="showCreateInvestmentModal"
  [investmentPackage]="asInvestmentPackage(selectedAgreement)"
  [leasePaymentMode]="investmentPackageType === 'LEASING'"
  [biddingMode]="investmentPackageType === 'BIDDING'"
  [existingBidRecord]="investorBidRecord"
  (investmentCreated)="onInvestmentCreated()"
></app-investment-package-create-investment-modal>

<app-investment-package-edit-modal
  [(visible)]="showEditInvestmentPackageModal"
  [investmentPackage]="asInvestmentPackage(selectedAgreement)"
  (investmentPackageUpdated)="onInvestmentPackageUpdated()"
></app-investment-package-edit-modal>

<app-investment-package-type-close-modal
  [(visible)]="showCloseModal"
  [packageTitle]="selectedAgreement?.title || ''"
  [confirmLoading]="closing"
  [(reason)]="closeReason"
  (confirm)="handleCloseConfirmation()"
></app-investment-package-type-close-modal>

<app-modal
  [(visible)]="showContractModal"
  title="Lease Contract Preview"
  [size]="'xxl'"
  [confirmText]="'Download PDF'"
  [cancelText]="'Close'"
  [confirmLoading]="contractLoading"
  [confirmDisabled]="contractLoading || !contractHtml"
  (confirm)="onDownloadContractFile()"
>
  <ng-template #modalBody>
    <div *ngIf="contractLoading" class="text-center py-8 text-gray-600">
      Loading contract...
    </div>
    <iframe
      *ngIf="!contractLoading"
      class="w-full h-[70vh] border border-gray-200 rounded-md bg-white"
      [attr.srcdoc]="contractHtml"
      title="Lease Contract Preview"
    ></iframe>
  </ng-template>
</app-modal>
