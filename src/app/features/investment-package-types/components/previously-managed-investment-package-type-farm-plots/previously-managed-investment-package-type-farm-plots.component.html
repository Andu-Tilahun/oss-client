<section class="border-t border-gray-200 pt-6 space-y-3">
  <div class="flex justify-center">
    <h3 class="text-base font-semibold text-gray-900">Previously Managed Lease Farm Plots</h3>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="rows"
    [loading]="false"
    [total]="rows.length"
    [showColumnPickerControl]="false"
    [showPagination]="false"
    [showAddButton]="false"
    [showRefreshButton]="false"
    [showViewButton]="true"
    [showEditButton]="false"
    [showDeleteButton]="false"
  ></app-data-table>
</section>
